# plan.yaml — Phase 2 pivot: hand-built garden logistics (Factorio-direction
# revision, user decision 2026-08-01)
#
# AUTHORITATIVE, DETAILED implementation plan. Written so an agent with no
# prior context — and less capable than the one who wrote this file — can
# execute Phase 1 correctly without guessing. Phases 2-5 are outlined at the
# depth that's honest to give without having built the phases before them;
# each carries an explicit "refine before starting" note rather than faked
# precision. Do NOT treat a light phase as low-priority — it is unstarted,
# not unimportant.
#
# THIS SUPERSEDES the previous plan.yaml (Mood Bell, Phase 2's first
# feature, shipped and committed 2026-08-01 as commit 3146a96). That plan's
# content is preserved in git history (`git show ba0f01f:plan.yaml` era
# onward) if it's ever needed again; it is not duplicated here.
#
# Relationship to other files:
#   - work_progress.yaml: lightweight STATUS tracker. Read it first — it
#     records what's actually landed vs. still planned, and gotchas found
#     along the way. It points back here for the "how."
#   - docs/_scratch/GameRules.md: canonical design spec, freshly revised
#     2026-08-01 (see its own Revision Log at the top). Every §-reference
#     below points at NEW or AMENDED sections from that revision — read
#     them before implementing, they carry the reasoning this plan leans on
#     without repeating in full. §9.8 (manual placement), §9.9 (buildable
#     routes), §9.10 (junctions/backpressure), §9.11 (misroutes/repair),
#     §10.0 (buildable habitats), §2.1/§2.5/§14 (fiction and guardrails
#     that still apply — read these especially before Phase 4/5, where the
#     temptation to add real punishment is highest).
#   - CLAUDE.md (repo root): standing project rules — verification standard
#     (typecheck && lint && test && build), sim/render/ui/audio/input
#     architecture boundary, propDims.ts as the single source of prop
#     dimensions.
#
# GLOBAL INVARIANTS — true in every phase:
#   1. Presentation vocabulary is UNCHANGED (GameRules §2.1's 2026-08-01
#      note): "Garden Slide" never "conveyor belt" in any player-facing
#      string, "Junction" never "splitter node", "waiting to be sorted"
#      never "blocked"/"error". Mechanics changed, fiction did not.
#   2. Nothing introduced by this plan is a permanent failure state
#      (GameRules §2.5's revision note). A stalled Sprout, a backed-up
#      junction, an unplaced-but-unlocked automation — all wait
#      indefinitely, cost nothing further, and resolve the instant the
#      player acts. If any implementation step makes one of these lossy,
#      timed, or punitive, STOP — that violates the revision's own
#      guardrail (§14's amendment), not just a nice-to-have.
#   3. Placement and routing stay strictly tile-grid-based, never freeform
#      (§9.9). A "draw a belt" interaction is drag-across-tiles snapping to
#      the grid one segment at a time, not an arbitrary curve.
#   4. Every phase must leave `npm run typecheck && npm run lint && npm
#      test && npm run build` green, per CLAUDE.md, before being considered
#      done — and per this project's own established practice, anything
#      that renders must be verified live in a browser, not just by
#      reading code.
#   5. `work_progress.yaml` gets updated AS PART OF each phase's work, not
#      afterwards — this project has repeatedly lost work-in-flight to
#      interruptions; the habit is load-bearing, not decorative.
#
# FILE-FORMAT NOTE (found 2026-08-02 while validating this file): plan.yaml
# uses one `steps:` key PER PHASE at the top level, so the document contains
# repeated `steps:` keys. That is fine for a human-read plan and is the
# file's established convention, but it means a strict YAML parser keeps only
# the LAST `steps:` block and silently drops the rest. Do not build tooling
# that parses this file as a single YAML mapping without first splitting on
# the `# ===` phase banners. Phase ids are quoted strings for the same class
# of reason: unquoted `6.10` parses as the float 6.1 and collides with 6.1.
#
#   6. Existing saves must keep loading. Every SimState shape change in
#      this plan needs a version bump and an explicit migration case in
#      `src/persistence/save.ts` — `normaliseEnvelope` only backfills
#      TOP-LEVEL keys, never reaches into arrays/records, so any
#      per-instance shape change (e.g. an AutomationInstance gaining a
#      field) needs its own migration logic, not just a version bump.

