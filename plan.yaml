  authored: 2026-08-01
  design_authority: docs/_scratch/GameRules.md (§9.8-§9.11, §10.0, revised 2026-08-01)
  supersedes: plan.yaml as of commit 3146a96 (Mood Bell — shipped, in git history)
  resolves_open_question: >
    work_progress.yaml's "Garden Slide visual incoherence" open question
    (structure sits north of Nursery, Meadow ride goes south, never
    touching it) is resolved BY this pivot, not worked around: once the
