# =============================================================================
# PHASE 1 — Manual placement of the three existing automations
# =============================================================================
# Cheapest phase first, on purpose: proves the placement UX end-to-end
# before Phase 2/3 build MORE things that need placing. No new mechanics
# (no belts-as-entities, no junctions-as-a-concept yet) — this phase moves
# WHERE the three automations that already exist (Garden Slide, Colour
# Gate, Mood Bell) get built, from "unlockSystem/purchaseUpgrade decide
# and place automatically" to "unlocking removes a restriction, the player
# places it by hand, constrained to valid tiles."
#
# KEY FINDING (verified by reading the code, not assumed): the ghost-preview
# build-mode UI ALREADY EXISTS and is currently DEAD CODE:
#   - src/ui/components/buildMenu.ts: renders a button per unlocked
#     automation, toggles a `selected` build-mode state, fires
#     `onEnterBuildMode`/`onExitBuildMode` hooks AND a
#     `terrarium:buildMode` CustomEvent.
#   - src/input/index.ts's InputHandle already exposes `previewAutomation`
#     and `clearAutomationPreview`, and src/render/automation.ts already
#     has a working `previewAt`/`clearPreview` ghost-mesh implementation.
#   - BUT: src/main.ts never passes `onEnterBuildMode`/`onExitBuildMode`
#     into `mountUI()` (confirmed by reading the full mountUI call — only
#     onPurchaseUpgrade/onSetColourGateLane/onSetMoodBellRule/debug are
#     wired). Nothing calls `input.previewAutomation` on pointer move
#     during build mode, and there is NO click-to-commit-placement handler
#     anywhere. The "Garden Slide" button visible in the build menu today
#     does nothing observable — it's orphaned scaffolding, not a finished
#     feature you're replacing.
#   - ALSO IMPORTANT: `src/render/automation.ts`'s exported
#     `isBuildableTile()` calls `isReservedTile()` (src/render/layout.ts),
#     which returns true for automation SITE tiles themselves (they're in
#     the reserved set, alongside Nursery/habitats/paths, for DECORATIVE
#     SCATTER avoidance — scenery must not spawn on top of a structure).
#     Do NOT reuse `isBuildableTile` for placement validity — it would
#     mark a Slide's own correct site as invalid. It has a different job
#     (keeping decorative props off gameplay tiles) and must be left alone
#     for that. Phase 1 needs a NEW, purpose-built validity function (see
#     below).
#
# DESIGN DECISION — how a manually-placed Garden Slide picks its
# destination: today `unlockSystem` hardcodes "always Sunflower Meadow"
# regardless of where the (fixed) site tile is, which is exactly the
# visual incoherence the user reported. New rule: a placed automation's
# destination is derived from ITS OWN SITE TILE via the existing
# `gardenRouteBetween` BFS (src/render/sprouts.ts) — whichever habitat is
# reachable by the shortest path from the site tile, without the route
# passing through another automation's site tile (so two automations on
# the same trunk don't both claim the same habitat leg). This is a strict
# generalisation of what Garden Slide/Colour Gate/Mood Bell already do for
# the RIDE ANIMATION (gardenRouteBetween already walks the real path
# network) — only the DESTINATION SELECTION moves from a hardcoded rule to
# a computed one. Where the player puts the structure now visibly IS what
# it does. This is the single most important design decision in this
# phase; get it right and §9.8/§10.0's "placement is meaningful" pillar is
# earned for free.
#
# Colour Gate keeps its two-lane fork behaviour unchanged in Phase 1 (still
# governs the one fixed fork at (8,6) — Phase 1 does NOT make junctions
# player-buildable, that's Phase 3+4). It can only be PLACED on a tile
# that is a genuine fork in the (still fixed, Phase-1) path network — i.e.
# only (8,6) validates as a Colour Gate site today. This is deliberately a
# placement-only change with a single legal site; it still satisfies
# §9.8's letter ("constrained to a genuine junction") and sets up Phase 4
# for when junctions become plural and player-built.
#
# STEPS
steps:
  - phase: 1.1
    title: Contracts and ids
    files:
      - docs/CONTRACTS.md
      - src/core/ids.ts
      - src/events/types.ts
    do: >
      Add a new event `automation:siteChosen` (or reuse/extend
      `automation:built` — DECIDE at implementation time whether "unlocked
      but not yet placed" needs its own visible sim state; see 1.2) is NOT
      yet an id/type change by itself. The concrete change here: extend
      `AutomationInstance` (src/sim/state.ts) — check whether it currently
      REQUIRES fromTile/toTile at creation time (it does, per systems.ts's
      purchaseUpgrade building the full instance in one step). Under this
      phase, an automation can be UNLOCKED (in `unlockedAutomations`)
      without an `AutomationInstance` existing yet at all — so
      `state.automations` becomes "one entry per PLACED automation", and
      `unlockedAutomations` alone represents "player may place this, has
      not yet". Confirm no existing code assumes
      `unlockedAutomations.includes(x) implies an instance with that
      automationId exists` — grep for `.automations.find` /
      `.automations.some` call sites against `unlockedAutomations` checks
      before changing this, several systems.ts functions (planRide,
      isMoodBellClaimed, moodBellBehavioralState) may implicitly assume
      this today and need an explicit "and it's actually placed" guard.
    verification: npm run typecheck (this step is mostly grep + read, changes should be minimal)

  - phase: 1.2
    title: Sim — decouple unlock from placement
    files:
      - src/sim/systems.ts
      - src/sim/unlocks.ts
      - src/sim/runtime.ts
    do: >
      `purchaseUpgrade`'s `colourGateUnlock`/`moodBellUnlock` branches
      currently build a full `AutomationInstance` immediately (fromTile/
      toTile hardcoded, `automation:built` emitted same tick). Split this:
      purchasing/reaching-threshold adds to `unlockedAutomations` and
      emits `automation:unlocked` ONLY — no instance, no `built` event.
      `unlockSystem`'s Garden Slide auto-unlock (today: unlock AND build
      in one step once the placement threshold is hit) becomes
      unlock-only too, for consistency with the other two.
      New function `placeAutomation(state, automationId, tile):
      TickResult` — the actual "player commits a placement" action,
      analogous to `setColourGateLane`/`setMoodBellRule`'s existing
      "plain function the runtime exposes" pattern (no GameEvent union
      member needed, matches docs/CONTRACTS.md's stated reasoning for why
      purchases work this way already). Validates: automationId is in
      `unlockedAutomations`, no existing instance of this automationId
      already placed (one instance per automation type, same as today),
      tile passes the NEW site-validity check (1.3), and — for
      `colourGate` specifically — tile is a genuine fork in
      `GARDEN_PATH_TILES` (§9.8's junction constraint). Computes
      destination via the `gardenRouteBetween`-style reachability rule
      above — BUT NOTE: `gardenRouteBetween` today lives in
      src/render/sprouts.ts, and sim must never import from render
      (architecture boundary, enforced by
      tests/unit/architecture.sim-boundary.test.ts). The BFS-over-tiles
      logic needs a sim-side twin (or a shared pure function moved to
      src/sim/ or src/core/ that both sim and render import) — do not
      import render's version from sim. Likely resolution: move the pure
      path-BFS itself (not the rendering-specific parts of
      gardenRouteBetween) into src/sim/layout.ts or a new src/sim/routing.ts,
      have src/render/sprouts.ts's gardenRouteBetween call it for the
      geometry list and add its own rendering-specific decoration on top.
      Builds the `AutomationInstance` with the computed destination,
      emits `automation:built` (now carrying the CHOSEN tile, not a
      hardcoded constant) plus any per-automation default-rule events
      (colourGateRuleChanged/moodBellRuleChanged, unchanged from today).
    verification: >
      Extend tests/unit/sim.systems.test.ts and sim.colourGate.test.ts /
      sim.moodBell.test.ts: purchasing no longer creates an instance;
      placeAutomation on an invalid tile is a no-op returning unchanged
      state (mirror the existing no-op-on-invalid pattern elsewhere in
      this file); placeAutomation on a valid tile creates the instance
      with the DESTINATION matching the reachability rule, not a
      hardcoded habitat. Add a determinism check: placing on a tile whose
      shortest-path habitat is ambiguous (equidistant) must resolve the
      same way every time from the same state (pick a documented
      tie-break, e.g. lowest habitatId alphabetically, and pin it in a
      test) — an automation that non-deterministically points at a
      different habitat between saves would be a real, confusing bug.

  - phase: 1.3
    title: Site validity + save migration
    files:
      - src/sim/layout.ts (or new src/sim/placement.ts)
      - src/persistence/save.ts
      - src/sim/state.ts
    do: >
      New pure function `isValidAutomationSite(automationId, tile,
      placedInstances): boolean` — purpose-built for this, NOT
      `isBuildableTile` (see the KEY FINDING note above for why that one
      is wrong for this job). Rules: tile must be on the current
      `GARDEN_PATH_TILES` network; tile must not already hold another
      placed automation or the Nursery/a habitat; for `colourGate`
      specifically, tile must be a fork (more than 2 path neighbours, or
      simply `tile === COLOUR_GATE_TILE` in Phase 1 since that's the only
      fork that exists pre-Phase-3 — write it as a real "count path
      neighbours" check even though today it only ever matches one tile,
      so Phase 3+4's player-built junctions are covered for free later
      without revisiting this function).
      SIM_SHAPE_VERSION bump (currently 4 -> 5): `AutomationInstance`'s
      shape is effectively unchanged (still has fromTile/toTile), but
      `unlockedAutomations` can now contain an id with NO matching
      `automations[]` entry, which is a new valid state a v4 save never
      produced. Migration case (save.ts): a v4 save's `automations[]`
      always has one instance per unlocked automation — that data is
      still perfectly valid under v5's looser invariant, so the migration
      is a no-op data-wise, but bump the version and add the case anyway
      (documented as "shape-compatible, version bumped for the loosened
      invariant" — do not skip a version bump just because no field
      changed, `normaliseEnvelope`'s docstring assumption is that
      version number reflects a reviewed shape, not that data moved).
    verification: >
      New tests/unit/sim.placement.test.ts: isValidAutomationSite for
      every automationId against every tile in a small fixture grid,
      including the "colourGate only on a fork" case. Extend
      tests/unit/persistence.save.test.ts for the v4->v5 case: a v4-shaped
      save with all 3 automations already built loads correctly under v5
      with no data loss.

  - phase: 1.4
    title: Wire the (already-built) placement UI to the new sim command
    files:
      - src/main.ts
      - src/ui/index.ts (verify hooks pass through, likely already correct)
      - src/render/automation.ts
      - src/input/index.ts
    do: >
      Wire `onEnterBuildMode`/`onExitBuildMode` into `mountUI()` in
      main.ts (currently missing — see KEY FINDING). On enter: input
      layer starts calling `input.previewAutomation(automationId, tile)`
      on pointer move (reusing the existing ghost-mesh preview machinery
      in automation.ts, but feeding it validity from the NEW
      `isValidAutomationSite`, not the ghost-preview's current default).
      Add a click-to-commit handler in input.ts's pointerdown/pointerup
      path, active only while build mode is selected: on a valid-tile
      click, call `sim.placeAutomation(automationId, tile)` (threaded
      through the same promise pattern main.ts already uses for
      onPurchaseUpgrade) and exit build mode; on an invalid tile, decline
      with the same "kind invalid feedback" §9.2 already establishes for
      structure placement (do not silently no-op — flash/tint the ghost
      red, matching an existing pattern if the codebase has one, e.g.
      Colour Gate's invalid-lane feedback).
      Also: while build mode is active, the existing Sprout-drag pickup
      path (pickSproutId etc.) should probably be suspended — decide and
      document whether a player can pick up a Sprout while placing a
      structure (likely: no, one interaction mode at a time, matching how
      pinch/drag/pan already mutually exclude each other in
      handlePointerDown).
    verification: >
      New tests/e2e/placement.dev.spec.ts (dev project): unlock Garden
      Slide via debug shortcuts, enter build mode via the real UI button,
      click a valid tile via real pointer events, assert
      `automation:built` fires with the clicked tile and the
      reachability-derived destination; assert clicking an invalid tile
      does not build anything and the automation stays in
      unlockedAutomations without an instance. Browser-verify live per
      CLAUDE.md's rendering standard: ghost preview visibly follows the
      cursor, tints red/green correctly, ACTUALLY shows up under the
      cursor while a matching-mood/type Sprout would still be draggable
      test manually to confirm the two interaction modes don't fight.

  - phase: 1.5
    title: UI copy for "unlocked, not yet placed"
    files:
      - src/ui/components/upgrades.ts
      - src/ui/uiState.ts
    do: >
      An unlocked-but-unplaced automation needs to say so somewhere the
      player will see it (§9.8: "say so plainly"). Minimal version: the
      Upgrades panel row, once purchased/maxed, gets a line like "Ready to
      build — open the build menu" instead of just "Max"; the build menu
      button itself should have a subtle "new" affordance the first time
      an automation becomes placeable. Keep this small — do not build a
      new notification system for it, reuse whatever affordance pattern
      (if any) already exists for "new Journal entry"/"new achievement".
    verification: Browser-verify live; no new unit test strictly required if this is presentational only, but add one if any uiState reducer logic changes.

  - phase: 1.6
    title: Docs, full verification, close the open question
    files:
      - docs/CONTRACTS.md
      - docs/ARCHITECTURE.md
      - docs/GAME_DESIGN.md
      - work_progress.yaml
    do: >
      Update CONTRACTS.md (new placeAutomation function signature,
      SIM_SHAPE_VERSION 5, isValidAutomationSite). ARCHITECTURE.md:
      describe placement as player-driven now, note the sim-side routing
      BFS move (1.2). GAME_DESIGN.md: rewrite whatever currently describes
      automations as auto-appearing. Close the
      "garden-slide-visual-incoherence"/open_questions entry in
      work_progress.yaml — this phase is what resolves it, cite the
      placeAutomation destination rule as the resolution. Full
      verification stack, live browser check of a full placement flow for
      all 3 automation types.
    verification: npm run typecheck && npm run lint && npm test && npm run build, plus the e2e spec from 1.4, plus a live browser pass.

# =============================================================================
# PHASE 2 — Buildable habitats (GameRules §10.0)
# =============================================================================
# Same placement pattern as Phase 1, applied to a new buildable thing
# (an additional habitat of an existing kind) rather than to the 3
# automations. Should reuse Phase 1's placement infrastructure
# (isValidAutomationSite's shape generalises to isValidHabitatSite;
# build-mode UI, ghost preview, click-to-commit are all NOT
# automation-specific once genericised — consider whether Phase 1 should
# name its functions/types generically from the start, e.g.
# `isValidPlacementSite(kind, tile)` where kind is automation-or-habitat,
# rather than automation-only, to avoid a rename in Phase 2).
steps:
  - phase: 2.1
    title: Data + ids for a second habitat instance of the same kind
    do: >
      REFINE AT START OF THIS PHASE, once Phase 1's placement code exists
      to generalise from. Key open design question to resolve first, not
      guess now: does a second Ember Nook get its OWN HabitatId (e.g.
      `emberNook2`), or does the existing `HabitatId` union stay 3 members
      and habitats become "N instances per kind" the way automations
      already are N-instances-of-a-type-capable in principle? The latter
      is a bigger, more invasive change (every `Record<HabitatId, X>` in
      the codebase — and there are many, per the Mood Bell plan's own
      "TypeScript enforces completeness" note — assumes exactly 3 keys)
      but is the more honest long-term model (matches how automations
      already work: `AutomationId` is the KIND, `AutomationInstance` is
      the placed thing, there can be many instances). Recommend the
      instance model (add a `HabitatInstance` layer analogous to
      `AutomationInstance`, keep `HabitatId` as "kind") over a
      `emberNook2`-style id explosion, but this needs a real design pass,
      not a plan-time guess — bring it back to the user or advisor before
      committing to one if the blast radius (every `Record<HabitatId,X>`
      site) looks larger than expected once actually surveyed.
    verification: N/A — this step is a design decision, make it before writing code.
  - phase: 2.2
    title: Cost curve, placement, sim wiring
    do: >
      Mirror Phase 1.2/1.3's pattern: a new habitat costs Dewdrops
      (escalating — reuse geometricCostCurve or design a dedicated curve;
      check reachability against real income the way
      tests/unit/data.upgrades.test.ts already does for existing
      upgrades), is placed via the same build-mode/ghost-preview/
      click-to-commit flow Phase 1 built (generalised, not duplicated),
      and must be visually equivalent to the original per §10.0 (same
      art, same capacity-upgrade eligibility).
    verification: Mirror Phase 1's verification shape — unit tests for cost/placement validity, e2e for the real click-to-build flow, live browser check for visual parity with the original habitat.

# =============================================================================
# PHASE 3 — Garden Routes as buildable segments (§9.9) + save migration
# ***** SUPERSEDED 2026-08-02 BY PHASE 7 (Garden Transit) *****
# =============================================================================
# GameRules' 2026-08-02 revision establishes that §9.9's "buildable route
# segment" and the new "Sprout Conveyor" are THE SAME MECHANIC under one name
# (see that revision's NAMING RESOLUTION note). Phase 3 therefore does not
# proceed as written: its four steps are superseded by the Conveyor tasks in
# Phase 7, which specify the same substrate with ports, pricing, refunds,
# configuration and recovery that Phase 3 never had.
#
# REPLACEMENT MAP — do not implement the left column, implement the right:
#   3.1 Route segment as sim state          -> 7.3 (transit domain model) + 7.10 (Conveyor entity)
#   3.2 Migration for fixed-to-dynamic path -> 7.2 (save migration, incl. the legacy single Slide)
#   3.3 sim.layout.test.ts pinned arithmetic-> 7.2 (same test, same reason, now covering Conveyors)
#   3.4 Build-mode UI for drawing segments  -> 7.6 (placement/preview) + 7.11 (Conveyor build flow)
#
# Phases 4 (junction backpressure) and 5 (misroute stalls) are NOT superseded:
# they operate on whatever the route substrate is called, and now operate on
# Conveyors. They still depend on this substrate existing — which Phase 7
# delivers instead of Phase 3.
# =============================================================================
# The big one. Turns GARDEN_PATH_TILES from a fixed constant into
# player-placed data. REFINE FULLY AT START OF THIS PHASE — the design
# below is direction, not a spec, because it depends on real decisions
# made during Phase 1 (the sim-side routing BFS's exact shape) that don't
# exist yet.
steps:
  - phase: "3.1"
    status: superseded
    superseded_by: "Phase 7 — see the replacement map in the Phase 3 banner above"
    title: Route segment as sim state
    do: >
      Path tiles move from a derived-at-import-time constant
      (GARDEN_PATH_TILES) to part of SimState (a new
      `routeSegments: TileCoord[]` or similar, versioned, migrated).
      Placing/removing a segment costs Dewdrops per §9.9 (small, felt
      cost). Decide: can EVERY tile have a route segment, or only tiles
      adjacent to an existing segment/Nursery/habitat/automation (almost
      certainly the latter — an unconnected segment is explicitly called
      out in §9.9 as "inert and clearly unfinished", implying connectivity
      is checked, but whether it's ENFORCED at placement time or just
      visually indicated needs deciding).
    verification: TBD at phase start — depends on the connectivity decision above.
  - phase: "3.2"
    status: superseded
    superseded_by: "Phase 7 — see the replacement map in the Phase 3 banner above"
    title: Migration for the fixed-to-dynamic path network
    do: >
      Existing saves have no `routeSegments` field and implicitly rely on
      the fixed GARDEN_PATH_TILES. Migration must backfill
      `routeSegments` from the CURRENT fixed network for any pre-v-N save,
      so an existing garden doesn't lose its paths the moment this phase
      ships. This is the single riskiest migration in this whole plan —
      get a persistence test for it before touching gameplay code, not
      after.
    verification: A persistence test that loads a pre-Phase-3 save and asserts the exact fixed-network tiles appear in the migrated routeSegments.
  - phase: "3.3"
    status: superseded
    superseded_by: "Phase 7 — see the replacement map in the Phase 3 banner above"
    title: sim.layout.test.ts's pinned arithmetic
    do: >
      `tileDistance(NURSERY, GATE) + tileDistance(GATE, habitat) ===
      tileDistance(NURSERY, habitat)` is pinned against the FIXED
      topology. Once routes are player-built, this identity is no longer
      universally true (a player can build an inefficient route). Decide
      what this test should assert instead — likely: the identity still
      holds for the DEFAULT starting network the game seeds a new save
      with (so it becomes a test of the starting layout, not a law of the
      universe), plus a new test that transport DURATION is computed from
      the ACTUAL placed route length, not Manhattan distance, once routes
      are dynamic.
    verification: TBD at phase start.
  - phase: "3.4"
    status: superseded
    superseded_by: "Phase 7 — see the replacement map in the Phase 3 banner above"
    title: Build-mode UI for drawing segments
    do: >
      Drag-across-tiles placement (§9.9: grid-snapped, not freeform) —
      likely a distinct build-mode variant from Phase 1's single-tile
      structure placement (a route is placed as a drag gesture across
      multiple tiles in one motion, each tile individually validated and
      costed as the drag crosses it). Reuse Phase 1's ghost-preview
      machinery per-tile rather than inventing a new preview system.
    verification: e2e spec drawing a multi-tile route via real pointer events; live browser check of the drag gesture.

# =============================================================================
# PHASE 4 — Junction accumulation / backpressure (§9.10)
# =============================================================================
# REFINE FULLY AT START. Depends entirely on Phase 3's route-segment data
# model existing (a junction is meaningfully "any tile with >2 route
# neighbours" only once routes are dynamic — Phase 1's Colour Gate
# fork-check was a placeholder for exactly this). Rough shape: a junction
# with no Gate, or a Gate with no rule for an arriving Sprout's kind,
# accumulates arrivals up to a visible cap (§9.10: art-based, like habitat
# capacity, never a bare number); reaching the cap backs pressure up to
# the PREVIOUS junction/Nursery. This needs its own accumulation data
# structure per junction tile in SimState, its own visual (a growing
# cluster at the junction, reusing whatever pattern habitats/Nursery
# already use for "waiting Sprouts"), and careful interaction with the
# existing automationSystem tick dispatch (a backed-up junction changes
# what "idle and eligible" means for planRide's dispatch loop).
steps: []

# =============================================================================
# PHASE 5 — Misroute stall-and-repair (§9.11)
# =============================================================================
# REFINE FULLY AT START. Depends on Phase 4's junction model (a "misroute"
# is specifically a Sprout dispatched through a MISCONFIGURED junction
# toward the wrong habitat, distinct from Phase 4's "no rule set yet"
# accumulation case). Needs: detecting the mismatch at dispatch time (not
# retroactively), a stalled-in-transit visual state distinct from both
# "riding" and "settled", a stall never expiring (§2.5's revision note —
# get an advisor/design read on this specifically, it's the mechanic
# closest to reading as a failure state if implemented carelessly), and
# two resolution paths (fix the junction going forward, hand-carry the
# stalled one) per §9.11.
steps: []

# =============================================================================
# PHASE 6 — World quality: terrarium, habitat identity, tactility
# =============================================================================
# Added 2026-08-02 after a full baseline diagnosis of the running game.
# INDEPENDENT of Phases 2-5 (those change what the player BUILDS; this changes
# what the world LOOKS AND FEELS LIKE) — they can proceed in either order, but
# 6.1/6.2 must precede everything else in this phase.
#
# HOW THIS PHASE WAS DIAGNOSED (evidence, not opinion):
# Baseline captured from a clean save in a real browser at 1440x900 and at a
# 390px viewport; screenshots in docs/visual-qa/planning-baseline/.
# Performance re-measured in real Chrome on a real GPU after an initial
# headless run produced misleading numbers (see 6.1 — this matters).
#
# THE FIVE FINDINGS THIS PHASE EXISTS TO FIX:
#   F1. IT IS NOT A TERRARIUM. The ground is a single flat plane that simply
#       ENDS, with black void above the horizon (01-fresh-garden-desktop.png).
#       There is no vessel, glass, rim, or boundary of any kind. GameRules §3.1
#       and the game's own name promise a contained little world; the build
#       delivers an open board floating in blackness.
#   F2. HABITATS ARE RECOLOURED DRUMS. Ember Nook, Dew Pond and Sunflower
#       Meadow are the same rounded cylinder in three colours, each with a
#       small illustration cap on top (03/04/05-*-closeup.png). Most starkly:
#       THE DEW POND CONTAINS NO WATER — it is a blue plinth, while actual
#       water decals sit elsewhere in the world, unrelated to it. This is
#       docs/REFERENCE_BOARD.md's explicit failure condition "habitats look
#       like generic props rather than distinct living homes".
#   F3. NO FOCAL HIERARCHY AND NO TERRAIN LAYERING. Uniform green ground,
#       evenly-scattered identical rock/agave props, zero elevation change, no
#       zones, no foreground framing. The Nursery — the thing the player must
#       look at first — is the same visual weight as everything else.
#   F4. GROUNDING IS INCONSISTENT AND PARTLY BROKEN. Sprouts carry heavy dark
#       ellipse shadows that stack into a muddy blob in a settled crowd
#       (10b-ember-nook-populated.png), while the habitat drums and the Nursery
#       have NO contact darkening where they meet the terrain. The Nursery's
#       own shadow is DETACHED — a separate dark ellipse floating to its left
#       (02-nursery-closeup.png). That last one is a positioning bug, not a
#       taste question.
#   F5. THE 390px VIEWPORT IS UNRESOLVED. Bottom nav overlaps Sunflower Meadow
#       and collides with the Garden Slide build button (11-mobile-390.png).
#
# WHAT IS NOT WRONG — DO NOT "FIX" THESE:
#   * PERFORMANCE IS HEALTHY. Measured in real Chrome, busy garden (292 meshes,
#     69 enabled Sprouts): 60fps, frame time median 16.7ms / p95 17.9ms, 308
#     draw calls per frame, 28k triangles, 61 materials, 64 textures. There is
#     headroom. Phase 6 SPENDS some of it deliberately and 6.18 guards the
#     budget — but nobody should arrive believing there is a perf crisis.
#   * Zero console errors and zero failed network requests on a full session.
#   * The Sprouts themselves are in good shape after the 2026-08-01 pass
#     (readable, grounded, animated) — see docs/visual-qa/improvement-log.md.
#     Their remaining gap (sprite-sheet padding) is logged there, not here.
#
# REFERENCE DISCIPLINE: every task below cites approved images under
# docs/references/ and the transferable principle from their adjacent .md.
# References teach measurable qualities ONLY. Never copy their creatures,
# props, layouts, UI, textures, names, or visual expression — each task's
# non_goals restates the protected elements for the specific images it cites.
steps:
  - phase: "6.1"
    title: Establish an honest performance and visual baseline
    status: planned
    why: >
      Every later task in this phase adds geometry, materials or lights, and
      needs a real budget to be measured against. It also has to correct a
      live measurement trap: `__debug.perf().drawCalls` reads
      `engine._drawCalls.current`, which is CUMULATIVE, not per-frame. A
      headless run of this baseline reported 130,323 "draw calls" and 4fps and
      looked like a catastrophe; the same build in real Chrome is 60fps at 308
      draw calls per frame. Anyone optimising against the raw counter would
      chase a phantom.
    files:
      - src/render/index.ts (the `perf` debug hook only)
      - docs/visual-qa/planning-baseline/ (already captured, extend if needed)
    references:
      - docs/references/tiny-glade/lighting-materials/tiny-glade-09.jpg
    principle: >
      tiny-glade-09.md: surface response and contact shadows must stay
      INSPECTABLE at close distance. That is only affordable if the frame
      budget is known, so measurement precedes art.
    do: >
      Change the `perf` debug hook to report draw calls PER FRAME (sample
      `engine._drawCalls.current` inside `scene.onAfterRenderObservable` and
      report the delta, or expose both `drawCallsCumulative` and
      `drawCallsPerFrame` — do not silently redefine the existing key without
      renaming it, the e2e helpers and any saved QA notes read it). Record the
      measured baseline into docs/visual-qa/improvement-log.md as the Phase 6
      budget. Note explicitly in that entry that headless Chromium uses
      SwiftShader and its fps is not evidence of anything.
    non_goals: >
      No rendering changes. No optimisation. Do not "improve" the numbers in
      this task — only measure them correctly.
    acceptance: >
      `__debug.perf()` reports a per-frame draw-call figure that stays within
      +/-10% of a manually sampled onAfterRender delta over 90 frames.
      docs/visual-qa/improvement-log.md contains a Phase 6 budget entry with
      fps, frame-time median and p95, per-frame draw calls, triangles,
      materials and textures for both an empty and a 20+-settled-Sprout
      garden, each stated as measured in real Chrome on a real GPU.
    evidence: docs/visual-qa/planning-baseline/ (already contains the 11 baseline captures)
    validation: npm run typecheck && npm run lint && npm test && npm run build
    accessibility: N/A (debug-only surface, never player-facing)
    performance: Establishes the budget; changes nothing.
    risk: >
      Very low. Rollback is reverting one debug hook. Risk of NOT doing it is
      high: the whole phase gets optimised against a meaningless number.
    commit: "chore(render): report per-frame draw calls and record the Phase 6 perf budget"
    verification: Compare the hook's output against a manual 90-frame onAfterRender sample in Chrome; both figures must agree.
    depends_on: []

  - phase: "6.2"
    title: Audit the scene, material, lighting and asset architecture
    status: planned
    why: >
      Phase 6 replaces a large amount of world geometry. Doing that without
      first knowing which meshes are load-bearing for GAMEPLAY (hit-testing,
      drop targets, occupancy signs, path routing, save-restored positions)
      risks breaking interaction while chasing looks. This project has a
      documented history of confident-but-wrong conclusions from reading code
      alone, so this audit is browser-verified, not desk-only.
    files:
      - docs/ARCHITECTURE.md (append an as-built world-rendering section)
    references:
      - docs/references/tiny-glade/tactile-geometry/tiny-glade-02.jpg
    principle: >
      tiny-glade-02.md: structures read as physical objects because they are
      built from visibly stacked sub-parts (base, frame, roof, trim). Knowing
      which existing meshes may be decomposed into sub-parts — and which are
      load-bearing — is the precondition for doing that safely here.
    do: >
      Produce a written map covering: every mesh name prefix currently in the
      scene and its owner module; which meshes are hit-tested or used as drop
      targets (src/input/index.ts's pickSproutId, habitats.nearestWithin,
      automation.nearestBuiltWithin); which are positioned from save-restored
      state; which are pure decoration and therefore SAFE TO REPLACE
      WHOLESALE; where prop dimensions come from (src/render/propDims.ts is
      the single source — confirm nothing else declares heights); and the
      current material families in src/render/pbrMaterials.ts with which
      objects use each. Explicitly list the safe-to-replace set — that list is
      what later tasks are allowed to touch freely.
    non_goals: >
      No refactoring. No mesh changes. Do not "tidy" anything found during the
      audit — record it and move on.
    acceptance: >
      docs/ARCHITECTURE.md contains a Phase 6 world-rendering section naming
      every `terrarium.*` mesh prefix, its owning module, and a
      gameplay-critical / safe-to-replace classification for each, verified
      against `__debug.meshNames('terrarium.')` in a running browser rather
      than from source alone.
    evidence: docs/visual-qa/planning-baseline/ (reuse; no new captures required)
    validation: npm run typecheck && npm run lint && npm test && npm run build
    accessibility: N/A (documentation task)
    performance: N/A
    risk: Low. Documentation only. Rollback is reverting the doc.
    commit: "docs(architecture): map the as-built world rendering and safe-to-replace assets"
    verification: Cross-check the written list against a live `__debug.meshNames('terrarium.')` dump; any prefix present in the scene and missing from the doc fails this task.
    depends_on: ["6.1"]

  - phase: "6.3"
    title: Rebuild the lighting foundation with warm/cool separation and soft contact shadows
    status: planned
    why: >
      Every subsequent art task is judged under this light. The current scene
      is a single key plus a fill, producing an even mid-value image with no
      warm/cool separation and no atmospheric depth — which is why bevels and
      material variation that DO exist in the geometry are invisible at
      gameplay distance. Fixing light first means later tasks are not
      compensating for it with emissive.
    files:
      - src/render/lighting.ts
      - src/render/quality.ts (tier interaction)
    references:
      - docs/references/tiny-glade/lighting-materials/tiny-glade-09.jpg
      - docs/references/ooblets/lighting-materials/ooblets-17.jpg
      - docs/references/slime-rancher-2/lighting-materials/slime-rancher-2-07.jpg
    principle: >
      tiny-glade-09.md — "light with sparse warm point lights against cool
      ambient so surface response and contact shadows stay inspectable up
      close". ooblets-17.md — "cluster 2-3 small emissive sources at different
      HEIGHTS to sculpt form with warm pools of light". slime-rancher-2-07.md —
      always anchor a translucent/soft body with a readable ground contact
      shadow so it stays grounded.
    do: >
      Establish a three-part rig: a warm key with soft shadows, a distinctly
      COOLER fill/ambient so the two are separable by eye, and an environment
      contribution for ambient occlusion-like depth. Tune shadow map
      resolution and blur per quality tier (src/render/quality.ts already
      tiers). Verify at the DEFAULT camera distance, not in a close-up — the
      failure mode to avoid is lighting that only reads when zoomed in.
    non_goals: >
      No bloom-dependent look (REFERENCE_BOARD fails a scene that "depends on
      bloom to look magical"). No copying tiny-glade's night palette or its
      lantern/timber-frame subject matter — take the warm-point-against-cool-
      ambient RELATIONSHIP only. No per-object lights (that is 6.9/6.16).
    acceptance: >
      At the default camera, sampling any habitat drum's lit side and shadow
      side yields a measurable hue difference (warm key vs cool fill), not just
      a value difference. Every habitat, the Nursery and every automation
      structure casts a visible soft contact shadow onto the terrain. Frame
      time p95 stays within the 6.1 budget +15%. Reduced-motion and the low
      quality tier both still render without shadow acne or missing shadows.
    evidence: >
      docs/visual-qa/planning-baseline/ before/after pairs at default camera:
      lighting-before.png, lighting-after.png, plus a low-quality-tier capture.
    validation: >
      npm run typecheck && npm run lint && npm test && npm run build; browser
      pass at default camera on high and low quality tiers.
    accessibility: >
      Must not reduce contrast between Sprouts and terrain. Verify the
      high-contrast/reduced-motion paths still read; light changes must not
      become the only carrier of any gameplay information.
    performance: >
      Shadow-map cost is the main risk. Stay within the 6.1 frame-time budget
      +15% on the high tier and at parity on the low tier.
    risk: >
      Medium — global change, affects every screenshot in the project.
      Rollback is a single-file revert of lighting.ts. Take before/after
      captures of all three habitats and the Nursery BEFORE merging.
    commit: "feat(render): warm/cool light separation with soft contact shadows"
    verification: Browser pass at default camera; sample lit/shadow-side pixels for hue separation; confirm contact shadows on all six major structures.
    depends_on: ["6.1", "6.2"]

  - phase: "6.4"
    title: Fix contact grounding — attach the Nursery's shadow, ground the drums, calm the Sprout crowd
    status: planned
    why: >
      Three concrete, evidenced grounding defects, all of which make objects
      look pasted onto the world rather than standing in it. One is an
      outright bug: the Nursery's contact shadow is DETACHED, rendering as a
      separate dark ellipse offset to the drum's left
      (02-nursery-closeup.png). Separately, six settled Sprouts' individual
      shadows stack into an unreadable dark blob
      (10b-ember-nook-populated.png), while the habitat drums have no contact
      darkening at all.
    files:
      - src/render/world.ts
      - src/render/habitats.ts
      - src/render/sprouts.ts (shadow alpha/size constants only)
    references:
      - docs/references/slime-rancher-2/lighting-materials/slime-rancher-2-07.jpg
      - docs/references/tiny-glade/lighting-materials/tiny-glade-09.jpg
    principle: >
      slime-rancher-2-07.md — "always anchor it with a faked blob shadow to
      keep translucency grounded". tiny-glade-09.md — a small prop mid-street
      is grounded by its contact shadow; grounding is what separates an object
      resting IN a scene from one drawn OVER it.
    do: >
      Find and fix the Nursery shadow offset (start from whatever positions
      the nursery mound's shadow in world.ts — the visible offset suggests a
      centre-vs-pivot mismatch of the same class already documented in
      src/render/sprouts.ts's height notes). Add contact darkening under each
      habitat drum and each automation plinth, sized to the base footprint.
      Reduce per-Sprout shadow strength and/or introduce a merged crowd
      shadow so a full habitat reads as a group standing on a surface rather
      than a dark smear — the current SHADOW_ALPHA_CONTACT was tuned against a
      SINGLE Sprout and was never re-checked at six.
    non_goals: >
      No shadow-map work (that is 6.3). No change to Sprout size or artwork.
      Do not remove Sprout shadows — the fix is calibration, not deletion.
    acceptance: >
      The Nursery's contact shadow is centred under the mound at every camera
      angle. Every habitat drum, the Nursery and every automation plinth show
      contact darkening at their base. With six Sprouts settled on one
      habitat, individual creatures remain separable from each other and from
      the shadow mass at the default camera.
    evidence: >
      docs/visual-qa/planning-baseline/grounding-before-*.png (reuse
      02-nursery-closeup.png and 10b-ember-nook-populated.png) plus matching
      after captures.
    validation: npm run typecheck && npm run lint && npm test && npm run build; browser pass with a full habitat.
    accessibility: >
      Shadow darkening must not reduce Sprout-vs-ground contrast below the
      level needed to pick a Sprout out of a crowd.
    performance: Contact decals are cheap; keep them within the 6.1 draw-call budget.
    risk: Low. Localised. Rollback per file.
    commit: "fix(render): attach the Nursery contact shadow and calibrate world grounding"
    verification: Browser pass; orbit-free camera moves at several radii confirming the Nursery shadow tracks its mound; six-Sprout crowd readability check.
    depends_on: ["6.3"]

  - phase: "6.5"
    title: Give the world a terrarium vessel and a horizon
    status: planned
    why: >
      The single largest gap between the game's premise and its build. The
      ground plane simply ends and everything above the horizon is black void
      (01-fresh-garden-desktop.png). Nothing tells the player they are looking
      into a contained little world, which is the entire fiction (GameRules
      §3.1) and the game's name. It also costs the scene its depth cue: with
      no background layer there is no foreground/midground/background at all.
    files:
      - src/render/background.ts
      - src/render/world.ts
      - src/render/propDims.ts (any new vessel dimensions)
    references:
      - docs/references/slime-rancher-2/scene-composition/slime-rancher-2-13.jpg
      - docs/references/slime-rancher-2/habitat-density/slime-rancher-2-06.jpg
      - docs/references/garden-galaxy/decorative-progression/garden-galaxy-06.jpg
    principle: >
      slime-rancher-2-13.md — "push background structures 2-3 value steps
      lighter with warm haze — cheap depth cue achievable in Babylon with fog
      plus a gradient skybox". slime-rancher-2-06.md — a single enclosing
      volume (there, a greenhouse) is what makes many small authored zones
      read as one PLACE. garden-galaxy-06.md — a seamless backdrop isolates a
      diorama so every object reads cleanly.
    do: >
      Add an enclosing vessel: a soft rim/lip bounding the garden floor, a
      gently curved glass or membrane suggestion above (originally designed —
      not a greenhouse pastiche), and a graded backdrop plus distance haze so
      the world reads as contained and has a far layer. The vessel must sit
      OUTSIDE the playable tile grid so it never becomes a drop target or
      occludes a habitat.
    non_goals: >
      Do NOT copy Slime Rancher 2's greenhouse dome, its white ribbed
      architecture, its glass panel pattern, or Garden Galaxy's pink backdrop.
      Take the enclosure RELATIONSHIP and the value/haze falloff only. No new
      gameplay space — this task adds no buildable tiles.
    acceptance: >
      At the default camera and at both zoom limits, no black void is visible
      above the horizon and the garden reads as enclosed. Background elements
      sit at least 2 value steps lighter than midground. The vessel is never
      hit-tested: dragging a Sprout over it produces no drop target and no
      hover highlight. No habitat, the Nursery, or any path tile is occluded
      by the vessel at any legal camera position.
    evidence: docs/visual-qa/planning-baseline/vessel-before.png (reuse 01-fresh-garden-desktop.png) and vessel-after-{default,minzoom,maxzoom}.png
    validation: npm run typecheck && npm run lint && npm test && npm run build; browser pass sweeping the full zoom and pan range.
    accessibility: >
      The vessel must not reduce contrast for gameplay objects; verify Sprouts
      and habitats still separate cleanly against the new background at both
      zoom limits.
    performance: >
      A skybox/backdrop plus one vessel shell should add a handful of draw
      calls; must stay within the 6.1 budget.
    risk: >
      Medium — a badly scaled vessel could occlude gameplay or trap the camera.
      Mitigate by keeping it outside the grid and sweeping the full camera
      range before merge. Rollback is a background.ts revert.
    commit: "feat(render): enclose the garden in a terrarium vessel with a graded horizon"
    verification: Browser pass across the full pan/zoom range; drag a Sprout over the vessel to confirm it is inert.
    depends_on: ["6.3", "6.4"]

  - phase: "6.6"
    title: Establish camera framing and focal hierarchy
    status: planned
    why: >
      Nothing in the current frame tells the eye where to look — the Nursery,
      the three habitats and the scatter props all carry equal visual weight
      (01-fresh-garden-desktop.png). GameRules §4.2 requires the default
      framing to show the Nursery, active habitats and main paths while
      keeping interaction targets comfortably large. The 2026-08-01 pass
      already pulled the default radius 19 -> 15 for target size; this task
      settles the composition question that change opened.
    files:
      - src/render/camera.ts
      - src/render/world.ts (any framing-driven layout nudges)
    references:
      - docs/references/slime-rancher-2/scene-composition/slime-rancher-2-13.jpg
      - docs/references/ooblets/scene-composition/ooblets-13.jpg
    principle: >
      slime-rancher-2-13.md — a focal anchor placed off-centre with layered
      depth behind it, value/saturation falloff carrying the layers.
      ooblets-13.md — "use a repeated post-and-rope rail as a leading line
      along walkable edges" — leading lines make a composition read as
      authored.
    do: >
      Decide and pin the default alpha/beta/radius/target so the Nursery reads
      as the primary focal point, all three habitats are fully visible
      (Sunflower Meadow is currently clipped by the bottom edge and the nav
      bar), and the path network works as a leading line from Nursery outward.
      Confirm the framing holds at 1440x900, 1280x720 and a 390px-wide
      viewport.
    non_goals: >
      No camera rotation (GARDEN_CAMERA_ALPHA is a standing invariant several
      render modules depend on — see src/render/camera.ts). No cinematic
      swoops. No change to pan/zoom limits beyond what framing requires.
    acceptance: >
      At default framing on 1440x900, 1280x720 and 390x844: the Nursery, all
      three habitats and both path spurs are fully visible and unclipped, and
      no habitat is overlapped by the bottom nav or the build button. A Sprout
      at the Nursery remains at or above the pixel height recorded in
      docs/visual-qa/improvement-log.md for the 2026-08-01 pass.
    evidence: docs/visual-qa/planning-baseline/framing-{1440,1280,390}-after.png
    validation: npm run typecheck && npm run lint && npm test && npm run build; browser pass at all three viewports.
    accessibility: >
      Interaction targets must not shrink below the current measured size;
      re-check the touch-target forgiveness noted in work_progress.yaml's
      open_questions for the 390px case.
    performance: N/A (no new geometry).
    risk: >
      Low-medium: framing interacts with the settled-crowd layout and the
      billboard invariant. Rollback is a constant revert.
    commit: "feat(render): pin default camera framing for a readable focal hierarchy"
    verification: Browser pass at three viewports with a full garden; confirm no habitat is clipped or UI-overlapped.
    depends_on: ["6.5"]

  - phase: "6.7"
    title: Layer the terrain into zones with elevation and grounded scatter
    status: planned
    why: >
      The garden floor is one uniform green plane with evenly distributed
      identical props and zero elevation change. REFERENCE_BOARD fails a build
      whose "terrain is a mostly empty plane or a repeated texture with no
      layers". Without zones there is also nothing for the habitats to sit IN,
      which is half of why they read as objects placed on a board rather than
      homes in a place.
    files:
      - src/render/world.ts
      - src/render/layout.ts (scatter/reserved-tile rules)
      - src/render/propDims.ts
    references:
      - docs/references/slime-rancher-2/habitat-density/slime-rancher-2-06.jpg
      - docs/references/slime-rancher-2/habitat-density/slime-rancher-2-12.jpg
      - docs/references/ooblets/habitat-density/ooblets-14.jpg
      - docs/references/ooblets/garden-composition/ooblets-01.jpg
    principle: >
      slime-rancher-2-06.md — "divide the floor into 3-4 readable 'rooms'
      separated by low rails and trellis walls". slime-rancher-2-12.md — "give
      each creature group its own visible paddock boundary inside one shared
      volume, and thread a single path network between plots so high density
      stays navigable". ooblets-14.md — "pack beds to near-overflow but keep
      each species' silhouette distinct and HEIGHT-STAGGERED (low rosettes
      front, bells mid, stalks back) so density reads as abundance rather than
      noise". ooblets-01.md — "edge garden beds with chunky rounded logs".
    do: >
      Introduce gentle elevation (a raised bank, a hollow, a shallow terrace),
      divide the floor into 3-4 legible zones with original low edging, and
      replace the uniform scatter with height-staggered planting that is dense
      in zone interiors and sparse along walking lines and drop targets. Keep
      the existing reserved-tile discipline so nothing spawns on gameplay
      tiles.
    non_goals: >
      Do NOT copy the reference crop species, log-round props, trellis
      patterns, paddock fencing or greenhouse rails as designs — take the
      zoning, height-staggering and edging PRINCIPLES. Do not add scatter
      within the Sprout pick radius of any drop target.
    acceptance: >
      From the default camera, at least three distinct terrain zones are
      identifiable by ground treatment and edging without reading any text.
      Planting shows at least three height bands. No scatter prop overlaps a
      habitat footprint, a path tile, an automation site, or the Nursery
      waiting-slot fan. Frame time p95 within the 6.1 budget +15%.
    evidence: docs/visual-qa/planning-baseline/terrain-before.png (reuse 01) and terrain-after-{default,closeup}.png
    validation: >
      npm run typecheck && npm run lint && npm test && npm run build; the
      existing scatter/reserved-tile unit tests must still pass; browser pass.
    accessibility: >
      Density must not reduce Sprout or habitat readability; re-run the
      six-Sprout crowd check from 6.4 against the new ground treatment.
    performance: >
      Highest-risk task in the phase for draw calls. Use instancing/thin
      instances for repeated planting; hard budget is the 6.1 figure +15%.
    risk: >
      Medium-high: scatter interacts with hit-testing and with the reserved
      tile set. Rollback is a world.ts revert. Land instancing before density.
    commit: "feat(render): layer the garden floor into zones with elevation and staggered planting"
