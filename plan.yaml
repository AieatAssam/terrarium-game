# =============================================================================
# VERIFICATION (every phase)
# =============================================================================
verification_standard: npm run typecheck && npm run lint && npm test && npm run build
rendering_standard: >
  Per CLAUDE.md: for anything that renders, source reading is not
  sufficient evidence — verify live in the browser (Claude Browser pane
  preview tools), not just by reading the code or trusting a stale HMR
  session. This project has a documented history of confident-but-wrong
