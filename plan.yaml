# plan.yaml — Mood Bell (Phase 2's first feature)
#
# AUTHORITATIVE, DETAILED implementation plan. Written so an agent with no
# prior context on this feature — and less capable than the one who wrote
# this file — can execute it correctly without guessing. Every phase names
# exact files, exact signatures, exact constants, and exact verification
# commands. Where a decision was made (not derived), the "why" is included
# so a reader can judge whether an edge case the plan didn't anticipate
# should follow the same reasoning.
#
# Relationship to other files:
#   - work_progress.yaml: lightweight STATUS tracker (what's done, what's
#     in flight, gotchas found along the way). Read it first to see how far
#     execution has gotten. It points back here for the "how"; this file
#     does not duplicate status, only the plan.
#   - /Users/aieat/.claude/plans/foamy-brewing-liskov.md: the plan-mode
#     artifact this file was expanded from (outside the repo, not
#     committed, may not persist across machines — this file is the
#     durable, in-repo copy of record).
#   - CLAUDE.md (repo root): the standing project rules this plan complies
#     with — verification standard (typecheck && lint && test && build),
#     the sim/render/ui/audio/input architecture boundary, propDims.ts as
#     the single source of prop dimensions.
#   - docs/_scratch/GameRules.md: canonical design spec. Section references
#     below (§9.5, §9.6, §7.3, §16, §9.1, §9.7) are load-bearing — if an
#     implementation choice would contradict one, STOP and surface it
#     rather than silently resolving it either direction (CLAUDE.md's
#     authority rule).
#
# GLOBAL INVARIANTS — true in every phase, repeated here because violating
# any one of them breaks something non-obvious later:
#   1. Mood is SEPARATE from sproutType. It NEVER changes which habitat is
#      correct for a Sprout. `sproutMatchesHabitat` (src/data/sproutTypes.ts)
#      is NOT touched by this feature at all.
#   2. Mood is assigned via its OWN independent RNG draw, never derived from
#      the sproutType roll. If you make mood a function of type (e.g. by
#      reusing the same `random01`/`nextSeed` from `pickSproutType`), ember
#      would always be the same mood — this silently defeats the entire
#      point of a second, orthogonal attribute. See Phase 3.
#   3. Before Mood Bell is built (`unlockedAutomations` does not contain
#      'moodBell'), the Garden Slide and Colour Gate must behave EXACTLY as
#      they do today, byte-for-byte. Every exclusion/partition rule below is
#      conditional on the Bell already existing.
#   4. Once Mood Bell IS built, it must not be able to visibly do nothing.
#      A Sprout matching the Bell's current mood must be UNAVAILABLE to the
#      Garden Slide and Colour Gate's own Nursery-pickup eligibility checks
#      (see Phase 5's "traffic partition" — this is the single most
#      important correctness property of this whole feature; a naive
#      implementation without it is a P0 gameplay bug, not a style nit).
#   5. TypeScript enforces most of the mechanical completeness for you:
#      every `Record<AutomationId, X>` in the codebase will fail to compile
#      until you add a `moodBell` entry. Treat every such compiler error as
#      a checklist item, not a nuisance — `npm run typecheck` after each
#      phase is how you find files this plan's author may not have listed.
#      (Discovered during Phase 1: `src/ui/components/buildMenu.ts` has
#      THREE such records — `AUTOMATION_LABEL`, `AUTOMATION_ICON`,
#      `AUTOMATION_MANIFEST_KEY` — not originally listed in the plan-mode
#      artifact. This file corrects that omission; see Phase 6.)

meta:
  feature: "Mood Bell — third automation, second Sprout attribute"
  requested_by: "user, via AskUserQuestion during this session"
  design_authority: "docs/_scratch/GameRules.md §9.5 (names 'Mood Bell' explicitly), §7.3 (names 'mood' as a future trait), §9.6 stage 4 ('multi-attribute routes'), §16 (Phase 1 Definition of Done, whose closing line anticipates a Phase 2)"
  scope_lift_already_recorded: "work_progress.yaml decisions: 'Stay inside Phase 1's declared scope, or lift...' — RESOLVED, lifted. This is NOT a GameRules §17 revision (GameRules.md itself never forbade Phase 2 content); confirm this reasoning still holds before touching GameRules.md itself — you should not need to."
  advisor_review: "This plan was reviewed by an advisor before implementation began. Four issues were found and are folded into the phases below, most importantly the traffic-partition design hole in Phase 5 — do not skip it."

phases:
  - id: 1
    name: "Core types + docs/CONTRACTS.md"
    status: "DONE — see work_progress.yaml for confirmation"
    goal: "Establish the new string-literal ids everything else depends on, and update the canonical contracts doc that src/core/ids.ts is copied from."
    files:
      - src/core/ids.ts
      - docs/CONTRACTS.md
    steps:
      - "In src/core/ids.ts: add `export type MoodId = 'sunny' | 'sleepy';` near SproutTypeId. Add 'moodBell' to the AutomationId union: `'gardenSlide' | 'colourGate' | 'moodBell'`. Add 'moodBellUnlock' to the UpgradeId union (append after 'colourGateUnlock')."
      - "In docs/CONTRACTS.md: mirror the exact same three type changes in the 'Core string ids' code block."
      - "In docs/CONTRACTS.md: add `mood: MoodId;` to the `sprout:spawned` event member in the GameEvent union code block, immediately after `sproutType: SproutTypeId;`."
      - "In docs/CONTRACTS.md: add a new union member `{ type: 'automation:moodBellRuleChanged'; mood: MoodId }` immediately after `automation:colourGateRuleChanged`."
      - "In docs/CONTRACTS.md: add `moodBellRule?: MoodId;` to the SaveLoadedSnapshot interface, immediately after `colourGateLanes?: ...`."
      - "In docs/CONTRACTS.md: add a new '### Members added for the Mood Bell' subsection after the existing 'Members added so a player can hand a Sprout to a helper directly' subsection, explaining the three new/changed event fields and why (mirror the existing subsections' style — reason, not just what)."
      - "In docs/CONTRACTS.md: bump 'Current version is **3**' to **4**, and add one sentence describing what v3→v4 backfills (mood per-sprout, defaulting 'sunny'; moodBellRule, defaulting 'sunny')."
      - "In docs/CONTRACTS.md: add `moods.ts` to the 'Data-driven definitions' bullet list, one line, same shape as the `sproutTypes.ts` line above it."
      - "In docs/CONTRACTS.md: fix the topology paragraph under 'World grid' — it currently (pre-this-feature) says 'an untouched southern run... hand-carried fallback route', which was ALREADY STALE before this feature (the Garden Slide has ridden that run automatically since 2026-07-31, per work_progress.yaml). Correct it AND add one clause about the new Mood Bell spur tile (9,8), decorative-only, in the same edit."
    constraints:
      - "Do not add a fourth member to SproutTypeId. Mood is a SEPARATE type, not a type variant."
      - "docs/CONTRACTS.md's own header says it is authoritative and other files are 'copied verbatim' from it — in practice edit src/core/ids.ts and docs/CONTRACTS.md together in the same step, not one then the other later, so they cannot drift even temporarily."
    verification:
      - "npm run typecheck — WILL fail after this phase alone (every Record<AutomationId, X> elsewhere in the codebase is now incomplete). This is EXPECTED and does not mean phase 1 is wrong — read the error list, it is your checklist of every file phases 2–7 must touch. Do not attempt to make typecheck pass by reverting phase 1; fix it forward through the later phases instead."
    reasoning: >
      Every other phase imports these three types. Getting this wrong (e.g.
      typo'ing 'moodbell' vs 'moodBell') means every subsequent phase's code
      fails to compile against the wrong string literal, and the failures
      will look unrelated to the actual typo. Do this phase first, alone,
      and let the typecheck errors on this file specifically pass before
      moving on.

  - id: 2
    name: "Data layer: moods.ts, spawning.ts, upgrades.ts, unlocks.ts"
    status: "DONE — typecheck/lint clean on src/data/ alone"
    goal: "Add the data tables and pure functions the rest of the feature reads from — no sim STATE changes yet (that's phase 3), no dispatch logic yet (phase 5)."
    files:
      - src/data/moods.ts (NEW)
      - src/data/spawning.ts
      - src/data/upgrades.ts
      - src/data/unlocks.ts
    steps:
      - >
        Create src/data/moods.ts. Mirror src/data/sproutTypes.ts's exact
        structure: an interface `MoodDefinition { id: MoodId; displayName:
        string; primaryColor: string; silhouetteKey: string }`, a
        `Record<MoodId, MoodDefinition>` constant named `MOODS` with two
        entries, and `export const MOOD_LIST: MoodDefinition[] =
        Object.values(MOODS);`. Suggested values (adjust art keys once
        actual manifest assets exist, per Phase 6):
          sunny:  { displayName: 'Sunny',  primaryColor: '#FFD54F', silhouetteKey: 'mood.sunny.badge' }
          sleepy: { displayName: 'Sleepy', primaryColor: '#7986CB', silhouetteKey: 'mood.sleepy.badge' }
        Do NOT add a habitatId-style field or an "any"-sentinel — mood has
        no correctness dimension, unlike sproutType's Star exception.
      - >
        In src/data/spawning.ts, add `export function pickMood(random01:
        number): MoodId { return random01 < 0.5 ? 'sunny' : 'sleepy'; }`
        directly below `pickSproutType`. Add a one-line doc comment stating
        it MUST be called with its own independent `nextRandom` draw, never
        the same `random01` used for `pickSproutType` — see Phase 3's
        spawnSystem change for why.
      - >
        In src/data/upgrades.ts, add to the `UPGRADES` record (after
        `colourGateUnlock`):
          moodBellUnlock: {
            id: 'moodBellUnlock',
            displayName: 'Mood Bell',
            description: 'Builds the Mood Bell: a helper that reads whether a Sprout is Sunny or Sleepy and carries a whole mood''s worth of them straight home — of any colour. Only purchasable once your Garden Slide and Colour Gate are both already built.',
            maxLevel: 1,
            effect: { kind: 'automationUnlock', magnitudePerLevel: 1 },
            costForLevel: flatCost(1500),
          },
        The cost (1500) is a first-pass estimate — roughly 2x colourGateUnlock's
        700, continuing the existing escalating-unlock pattern. Flag it in
        a code comment as needing a playtest check, exactly like the
        original balance values' own comments do.
      - >
        In src/data/unlocks.ts: widen the `UnlockThreshold` interface with
        one new optional field: `requiresColourGateBuilt?: boolean;` (mirrors
        `requiresGardenSlideBuilt` exactly). Add a new
        `MoodBellUnlockState { gardenSlideBuilt: boolean; colourGateBuilt:
        boolean }` interface. Add to `UNLOCK_THRESHOLDS`:
          moodBell: {
            automationId: 'moodBell',
            requiredCorrectPlacements: 0,
            requiresGardenSlideBuilt: true,
            requiresColourGateBuilt: true,
          },
        Add `export function isMoodBellUnlocked(state: MoodBellUnlockState):
        boolean { return state.gardenSlideBuilt && state.colourGateBuilt; }`.
        Add `export function moodBellLockReason(state: MoodBellUnlockState):
        string | null` mirroring `colourGateLockReason`'s cheapest-to-satisfy-
        first structure: if `!gardenSlideBuilt` return a sentence about the
        Slide; else if `!colourGateBuilt` return a sentence about the Gate;
        else return null. Keep the copy in garden language, no "requires
        X=true" phrasing (GameRules §11).
    constraints:
      - "pickMood must be a pure function of its single random01 argument — no Date.now(), no Math.random(), matching every other pick* function in this codebase (docs/CONTRACTS.md's determinism rule)."
      - "moodBellLockReason must never mention colourGateUnlock's own price or ticks — those are the Gate's own unlock condition, irrelevant to the Bell's (which only cares whether the Gate automation instance exists, not how it was obtained)."
    verification:
      - "npm run typecheck — src/data/*.ts should now be internally consistent (Record<UpgradeId,...>/Record<AutomationId,...> completeness for anything scoped to src/data/). Errors from src/sim/, src/render/, src/ui/ are still expected until later phases."
      - "npm run lint"
    reasoning: >
      This phase is pure data + pure functions, zero sim STATE and zero
      dispatch logic — it cannot break anything at runtime yet because
      nothing calls pickMood or reads UNLOCK_THRESHOLDS.moodBell until later
      phases wire them in. Getting the data shapes right here, mirroring
      the two existing precedents (sproutTypes.ts, colourGate's unlock
      shape) exactly, is what makes phases 3–5 mechanical rather than
      creative.

  - id: 3
    name: "Sim state + persistence migration v3→v4"
    status: "DONE — typecheck clean; migration tests pass in Phase 4/5's run below"
    goal: "Add the two new fields to the save format (SproutInstance.mood, SimState.moodBellRule) and the migration that backfills them for existing saves."
    files:
      - src/sim/state.ts
      - src/persistence/save.ts
    steps:
      - "In src/sim/state.ts's SproutInstance interface, add `mood: MoodId;` (import MoodId from '../core/ids' alongside the other id imports already there)."
      - "In SimState interface, add `moodBellRule: MoodId;` immediately after `colourGateLanes: ColourGateLanes;`, with a doc comment mirroring colourGateLanes' own doc comment style: it is always populated (unlike colourGateLanes it has no 'nobody yet' null state — the Bell always has SOME rule, even before it's built, where the value is simply inert)."
      - "Bump `export const SIM_SHAPE_VERSION = 3;` to `= 4;`."
      - "In `createInitialSimState`, add `moodBellRule: 'sunny',` to the returned object, immediately after `colourGateLanes: defaultColourGateLanes(),`."
      - >
        In src/persistence/save.ts: bump `export const CURRENT_SAVE_VERSION
        = 3;` to `= 4;`.
      - >
        Rename the existing `case 3: return envelope;` terminal case — it
        is about to stop being terminal. Insert a NEW `case 3: { ... }`
        block BEFORE it (i.e. the new case 3 upgrades a v3 envelope to v4;
        the old terminal case becomes `case 4: return envelope;`). Mirror
        the exact structure of the existing `case 2` block (variable named
        `sim`, cast pattern, `migratedSim` object, recursive
        `migrateEnvelope({ ...envelope, version: 4, sim: migratedSim })`
        call at the end). The new case's body:
          const sim = envelope.sim as unknown as Omit<SimState, 'sprouts'> &
            Partial<Pick<SimState, 'moodBellRule'>> & {
              sprouts: Array<Omit<SimState['sprouts'][number], 'mood'> & Partial<Pick<SimState['sprouts'][number], 'mood'>>>;
            };
          const migratedSim: SimState = {
            ...sim,
            shapeVersion: 4,
            moodBellRule: sim.moodBellRule ?? 'sunny',
            sprouts: sim.sprouts.map((s) => ({ mood: 'sunny', ...s })) as SimState['sprouts'],
          };
          return migrateEnvelope({ ...envelope, version: 4, sim: migratedSim });
      - >
        Add a doc-comment note directly above this new case 3, stating
        PLAINLY: `normaliseEnvelope` (the function below `migrateEnvelope`
        in this same file) only backfills MISSING TOP-LEVEL SimState keys —
        it iterates `Object.keys(createInitialSimState(...))`, which never
        reaches into `sprouts[]`. It covers a missing `moodBellRule` for
        free (top-level key) but NOT a missing per-sprout `mood` — THIS
        migration case is the sole mechanism backfilling `mood` on old
        sprouts. If this case is ever wrong or skipped, a loaded sprout's
        `mood` silently becomes `undefined`, not a default — this is why
        Phase 4's persistence test must check per-sprout mood explicitly,
        not just that loading doesn't throw.
    constraints:
      - "Do NOT use Math.random() or any RNG inside the migration — it must be a pure function of the input envelope, same as every other migration case."
      - "Do not skip renumbering the old terminal case from `case 3` to `case 4` — leaving both a mutating `case 3` and the old no-op `case 3` in the same switch is a duplicate-case TypeScript/runtime bug, not just a style issue."
    verification:
      - "npm run typecheck — src/sim/state.ts and src/persistence/save.ts should compile cleanly on their own now (other files will still show errors from Record<AutomationId,...> completeness until phase 6)."
      - "Do not run the full test suite expecting green yet — tests/unit/persistence.save.test.ts still needs a new v3→v4 case (phase 4) before it will pass; existing v1→v2/v2→v3 migration tests should still pass unmodified."
    reasoning: >
      This is the highest-risk phase to get wrong silently: a save-format
      migration bug does not show up in normal dev-server testing (a fresh
      save always starts at the current version) — it only surfaces when
      someone loads an OLD save, which may not happen again until a real
      player's browser does it. This is why the "sole mechanism" note above
      is written directly into the code, not just this plan file — so a
      future reader touching normaliseEnvelope doesn't assume it already
      covers per-sprout fields.

  - id: 4
    name: "Sim-layer unit tests: write the failing tests BEFORE the dispatch logic that makes them pass"
    status: "DONE — all tests written, confirmed red (missing-export errors) before Phase 5 began"
    goal: "Lock in the exact behavior Phase 5 must implement, including the traffic-partition property, as executable tests — before writing the implementation, so Phase 5 has a concrete definition of done rather than the author's own judgment of 'looks right'."
    files:
      - tests/unit/data.moods.test.ts (NEW)
      - tests/unit/data.spawning.test.ts (extend)
      - tests/unit/sim.moodBell.test.ts (NEW)
      - tests/unit/data.unlocks.test.ts (extend)
      - tests/unit/persistence.save.test.ts (extend)
    steps:
      - >
        tests/unit/data.moods.test.ts — mirror tests/unit/data.sproutTypes.test.ts's
        structure exactly (it is short, read it first): assert MOOD_LIST has
        exactly 2 entries, assert every MoodDefinition has a non-empty
        displayName/primaryColor/silhouetteKey, assert MOODS keys match
        MoodId's two literal values exhaustively.
      - >
        tests/unit/data.spawning.test.ts — add a describe block for
        pickMood: assert pickMood(0) === 'sunny', pickMood(0.999) ===
        'sleepy', boundary at 0.5. THEN add the uncorrelation test the
        advisor review specifically asked for: seed a small deterministic
        loop (reuse this file's existing RNG-seeding pattern if one exists,
        else `nextRandom` from src/sim/rng.ts directly) calling
        pickSproutType and pickMood with TWO INDEPENDENT successive
        nextRandom draws per iteration (not the same draw for both) across
        e.g. 200 iterations, and assert the resulting (type, mood) pair
        counts are NOT collapsed to a single mood per type (e.g. assert
        that 'ember' appears with BOTH 'sunny' and 'sleepy' at least once
        in the sample — a weak but sufficient regression guard against the
        exact bug the advisor flagged: reusing one RNG draw for both rolls).
      - >
        tests/unit/sim.moodBell.test.ts — mirror
        tests/unit/sim.colourGate.test.ts's six describe-block structure
        (topology, pure destination function, rule-mutation events,
        end-to-end tick-driven dispatch, fallback/edge cases), adapted for
        Mood Bell's single-leg shape. Required cases, be exhaustive:
          - moodBellDestination('ember') === 'emberNook', ('star') === null.
          - setMoodBellRule: no-op (no event) when unchanged; emits
            automation:moodBellRuleChanged with the new mood when changed.
          - Tick-driven: a 'sunny' Sprout at the Nursery boards the Bell
            (built, rule='sunny') and settles at ITS OWN habitat — run this
            for at least two DIFFERENT sproutTypes in the same test to prove
            the destination is genuinely computed per-sprout, not fixed at
            build time (this is the property that most distinguishes Mood
            Bell from Garden Slide).
          - A 'sleepy' Sprout is left idle when the Bell's rule is 'sunny'.
          - A Star Sprout of the matching mood is NEVER boarded by the Bell
            (moodBellDestination returns null for it).
          - The Bell waits (does not dispatch) when its boarded Sprout's own
            habitat is already full — mirrors the Slide's own
            habitatIsFull check.
          - THE PARTITION TEST (do not skip — this is the test that would
            have caught the advisor's design hole): with all three
            automations built, a Sprout whose mood matches
            state.moodBellRule and whose type matches the Colour Gate's
            OWN currently-configured lane is dispatched by the BELL, not
            the Gate — assert the resulting sprout:transportStarted event's
            automationId === 'moodBell', not 'colourGate'. Do the same for
            the Garden Slide (a Sprout whose mood matches the Bell AND
            whose type is the Slide's fixed target goes to the Bell, not
            the Slide). A THIRD case: a Sprout whose mood does NOT match
            the Bell's rule still goes to the Gate/Slide exactly as before
            (proves the partition doesn't over-exclude).
      - >
        tests/unit/data.unlocks.test.ts — extend for the new threshold
        shape: isMoodBellUnlocked(false,false)===false,
        (true,false)===false, (true,true)===true. moodBellLockReason
        returns non-null in the first two cases, null in the third, and the
        returned strings never contain the literal substrings
        'colourGateUnlock' or 'gardenSlide' (garden-language check, mirrors
        how colourGateLockReason is likely already tested — check that
        file's existing style first and match it).
      - >
        tests/unit/persistence.save.test.ts — extend with a v3-shaped
        envelope fixture (a sim object missing `mood` on its sprouts and
        missing `moodBellRule` entirely, `version: 3`), load it through
        migrateEnvelope, and assert BOTH: (a) every sprout in the result has
        `mood === 'sunny'`, and (b) `sim.moodBellRule === 'sunny'`. This is
        the test Phase 3's migration case must satisfy — write it to fail
        against Phase 3's code if Phase 3 is wrong, not to describe an
        aspiration.
    constraints:
      - "These tests are EXPECTED TO FAIL after this phase (Phase 5's dispatch logic doesn't exist yet) — that is the point. Do not weaken an assertion to make it pass early; if a test seems wrong, fix the test's own reasoning against this plan's Phase 5 spec, not by loosening it."
      - "Every new test must import real constants (UNLOCK_THRESHOLDS.moodBell.requiredCorrectPlacements, UPGRADES.moodBellUnlock.costForLevel(1), etc.) rather than hardcoding literals — this codebase's own stated convention (see upgrades.ts's cost-curve comment, unlocks.ts's capacity-coupling comment) and the reason a prior balance rebalance didn't silently break assertions elsewhere in this repo."
    verification:
      - "npm test — new/extended test files should FAIL at this point (moodBell dispatch logic doesn't exist until Phase 5) with clear, specific assertion failures, not import errors or type errors. If you see import/type errors here, go back to Phases 2–3 — something's shape is wrong."
      - "npm run typecheck && npm run lint should still pass — test files must compile even though their assertions fail."
    reasoning: >
      Writing the partition test BEFORE the partition implementation is the
      single most important sequencing decision in this whole plan. The
      advisor review found the traffic-domination bug by READING the
      dispatch loop's iteration order, not by running anything — a plan
      that goes straight to "implement planRide's moodBell branch" risks a
      future implementer doing exactly what the naive first draft of this
      plan did (add a branch, forget the exclusion) and shipping something
      that typechecks, has a green build, and is silently broken in actual
      play. A red test for the partition property, written now, makes that
      impossible to miss in Phase 5.

  - id: 5
    name: "Sim logic: dispatch + the traffic partition (the core of the feature)"
    status: >
      DONE — full unit suite green (292/292, +34 from Phase 1's 258),
      typecheck clean except the EXPECTED render/UI Record<AutomationId,...>
      completeness errors (Phases 6-7). One real implementation fix found
      during red->green: isMoodBellClaimed originally keyed off
      `unlockedAutomations.includes('moodBell')`, which the partition test
      caught as inconsistent with the rest of this file's own idiom
      (colourGateBehavioralState keys off an actual instance in
      `state.automations`, not unlockedAutomations) — switched to
      `state.automations.some(a => a.automationId === 'moodBell')` to match.
      Also: adding MOOD_BELL_TILE to AUTOMATION_SITE_TILES perturbed
      tests/unit/render.procgen.test.ts's pinned scenery-scatter
      tally/length/digest (a new reserved-clearance zone shifts the
      deterministic scatter sequence, same category of change as when the
      Colour Gate fork was first added — see that test's own comment,
      updated in place). Values regenerated via vite-node, not hand-guessed.
    goal: "Make Phase 4's tests pass. This is where the feature actually becomes real."
    files:
      - src/sim/layout.ts
      - src/sim/systems.ts
      - src/sim/runtime.ts
      - src/events/types.ts
    steps:
      - >
        src/events/types.ts: add `mood: MoodId;` to the `sprout:spawned`
        member (import MoodId). Add
        `| { type: 'automation:moodBellRuleChanged'; mood: MoodId }`
        immediately after the `automation:colourGateRuleChanged` member.
        Add `moodBellRule?: MoodId;` to the save:loaded snapshot interface,
        after `colourGateLanes?: ...`. (This mirrors docs/CONTRACTS.md's
        Phase 1 edits exactly — that doc is the spec, this file is the
        implementation; keep them identical.)
      - >
        src/sim/layout.ts: add `export const MOOD_BELL_TILE: TileCoord = {
        x: 9, z: 8 };` near GARDEN_SLIDE_TILE/COLOUR_GATE_TILE. Add
        `moodBell: MOOD_BELL_TILE,` to `AUTOMATION_SITE_TILES`. Find the
        IIFE that builds GARDEN_PATH_TILES (constructs it as a union of
        Manhattan runs via a helper — read the existing 4-run construction
        first) and add a 5th short run: `pathBetween(NURSERY_TILE,
        MOOD_BELL_TILE)`. Update this file's own topology ASCII-diagram
        comment block to show the new spur (mirror how the diagram already
        shows the Slide's own spur north of the Nursery).
      - >
        src/sim/systems.ts — add `moodBellDestination`:
          export function moodBellDestination(sproutType: SproutTypeId): HabitatId | null {
            return SPROUT_TYPES[sproutType].habitatId;
          }
        Place it near colourGateDestination, with a doc comment explaining
        it deliberately reuses the same field colourGateDestination checks
        via sproutMatchesHabitat, just returning the habitat directly since
        there's no lane to validate against (naturally null for Star,
        same reason the Gate excludes it).
      - >
        src/sim/systems.ts — add the partition predicate, placed near
        planRide (it is used BY planRide, define it just above):
          function isMoodBellClaimed(state: SimState, sprout: SproutInstance): boolean {
            return state.unlockedAutomations.includes('moodBell') && sprout.mood === state.moodBellRule;
          }
        Doc comment: this is Phase 5's core correctness property — read
        this plan's Phase 4/5 reasoning before changing it. False before
        the Bell exists (checked via unlockedAutomations, not merely
        whether an AutomationInstance object exists in state.automations,
        so a Bell that's unlocked-but-somehow-not-yet-instantiated still
        counts as claiming — should not be reachable in practice since
        purchaseUpgrade builds the instance atomically with the unlock, but
        keying off unlockedAutomations is the same pattern colourGate's own
