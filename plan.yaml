      an event". slime-rancher-2-05.md — tie decorative unlocks to event
      moments so progression visibly transforms the space.
    do: >
      Define a small decorative progression: each unlock both places a
      distinct object AND triggers a soft-edge pass that dresses zone borders,
      so the garden visibly becomes more finished. Cap total decoration so
      density stays readable.
    non_goals: >
      Do NOT copy reference props, pedestals, pergolas or string-light
      designs. No unbounded decoration. No new currency or economy change
      without a GameRules revision — surface the conflict first if one seems
      needed.
    acceptance: >
      Purchasing a decorative unlock produces an immediately visible world
      change at the default camera, not only a counter change. Total
      decoration is capped and the cap is documented. At the cap, all
      gameplay objects remain readable and frame time stays within budget.
    evidence: docs/visual-qa/planning-baseline/decor-{none,mid,capped}.png
    validation: npm run typecheck && npm run lint && npm test && npm run build; browser pass at three decoration levels.
    accessibility: Decoration must never overlap or obscure a drop target or Sprout.
    performance: Measure at the decoration cap; within the 6.1 budget +15%.
    risk: >
      Medium — clutter risk is exactly what REFERENCE_BOARD warns about.
      The cap is the mitigation and must land with the feature, not after.
    commit: "feat(world): make decorative unlocks visibly finish the garden"
    verification: Capture at zero, mid and capped decoration; readability and frame-time checks at the cap.
    depends_on: ["6.7", "6.16"]

