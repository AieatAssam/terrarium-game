completed:
  - commit: a98b552
    summary: >
      Sprout crowd performance fix, conveyor ride-height fix, and manual
      drop-onto-automation feature — all four checks pass
      (typecheck/lint/258 tests/build), verified in-browser both via the
      Browser pane and a standalone headed Playwright harness.
    detail: >
      TRANSPORT REGRESSION (the task this started as): investigated first,
      found NOT a code bug. sprout:transportStarted fires correctly, the
      BFS route resolves, and the Colour Gate's two-leg dispatch works
      exactly as designed — reproduced with a headed Playwright harness
      against seeded saves, on both the pre-fix and post-fix code.
      Automation only goes idle when its one destination habitat is
      genuinely full (by design, already shown via amber glow/parked
      parcel/"waiting" lane lamps). The real, previously-undocumented
      surprise: Sunflower Meadow has no automated route at all (see the
      sunflower-meadow-manual-only gotcha above) — accounts for a third of
      any big backlog never moving. No sim/render logic changed for this.

      CROWD PERFORMANCE (the task's actual ask): a seeded 850-Sprout save
      measured 13.6 FPS median under 8x CPU throttle (pre-fix code, same
      scenario that ran 60 FPS unthrottled — the bug only shows under
      representative hardware load), driven by ~885 per-instance PBR
      materials and ~817 individually-drawn meshes. Fixed with one shared
      material per (species, visual state) — swapped, never mutated in
      place, so drag-tint feedback can't bleed onto every Sprout sharing a
      state — plus NURSERY_VISIBLE_SLOTS (12), a standing-room cap for the
      Nursery's waiting crowd mirroring the settled-Sprout cap habitats
      already had. Same scenario after: 60 FPS median, 44 materials, 30
      enabled meshes. Nothing is deleted; over-cap Sprouts are disabled
      (not drawn, not pickable — src/input/index.ts's pickSproutId now
      skips them) and promoted back the instant a slot frees up.

      CONVEYOR GAP (fresh report, folded in): a carried Sprout rode at a
      height tuned to clear the Nursery mound for its WHOLE journey —
      roughly twice the Slide/Gate's own height above their belt while
      passing beside one. New SPROUT_RIDE_HEIGHT derives from the
      automation site's own top face (src/render/propDims.ts's
      automationSiteTopY) instead, same pattern as every other "resting on
      a surface" height in sprouts.ts. Measured mid-ride in a fresh headed
      run: sprout Y ~0.85-1.0 vs. the Slide's own bead Y ~0.62 (was up to
      ~1.31 before). Screenshot at /tmp/report1-ride-midflight.png (not
      committed — scratch artifact) if useful for a follow-up visual call.

      MANUAL DROP ONTO AUTOMATION (fresh report, folded in): input/index.ts
      only ever resolved a drop against habitats. Added
      automation.nearestBuiltWithin (mirrors habitats.ts's own
      footprint-based hitbox from commit 20d4d87) and sim-side
      adjudicateAutomationDrop, both wired through sprout:dropped's new
      optional overAutomation field. adjudicateAutomationDrop is
      deliberately routed through the SAME beginRide helper the tick-based
      automationSystem dispatcher itself was refactored to use, so a
      manual drop can never board a ride the automation would have refused
      on its own next tick. An ineligible drop emits
      sprout:automationDeclined with a reason code (notBuilt/busy/noRoute/
      wrongKind/destinationFull) and changes nothing — Sprout stays idle,
      pickable, exactly where it was. docs/CONTRACTS.md updated in
      lockstep (event union is a shared contract, not sim-only). 10 new
      unit tests in tests/unit/sim.systems.test.ts pin every decline
      reason plus both Colour Gate legs; browser-verified end to end
      (a real decline fired through the full input->bus->sim->event chain
      with the Sprout confirmed still enabled/pickable afterward — the
      specific reason captured was 'busy' rather than 'wrongKind' due to a
      race with the automatic dispatcher grabbing the test candidate
