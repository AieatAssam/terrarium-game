      match's surrounding shape, don't assume "same field name = same
      match" for a bulk regex against test fixtures.
      NEXT: Phase 1.4 — wire onEnterBuildMode/onExitBuildMode into
      mountUI() (src/main.ts), feed the ghost preview from
      isValidAutomationSite, add a click-to-commit handler calling
      placeAutomation, update src/render/automation.ts to create/position
