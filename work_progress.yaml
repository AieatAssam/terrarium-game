      placeAutomation call). GOTCHA hit while doing this: a bulk regex
      script adding `siteTile:` to AutomationInstance-shaped fixtures
      false-matched two `expect.objectContaining({ automationId, toTile })`
      event assertions in sim.systems.test.ts (they aren't
      AutomationInstance literals, `sprout:transportStarted` events don't
