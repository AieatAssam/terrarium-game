# ---------------------------------------------------------------------------
# Authority: what wins when documents disagree
# ---------------------------------------------------------------------------
canonical_docs:
  - path: docs/_scratch/GameRules.md
    role: >
      THE canonical design spec. Its section 17 states it wins over any
      implementation, and that revising it requires a deliberate, recorded
      change plus updates to dependent docs and tests. Do not quietly
      contradict it to make an implementation easier. If a feature request
      conflicts with it, say so and ask, rather than implementing either side
      silently.
  - path: docs/CONTRACTS.md
    role: Integration contract — event union, ids, grid model, save format.
  - path: docs/ARCHITECTURE.md
    role: As-built architecture. Kept in sync deliberately; it has gone stale before.
  - path: docs/HATCHERY_PICKING_PROPOSAL.md
    role: Design investigation, not yet implemented. See open_questions below.

# ---------------------------------------------------------------------------
# Hard-won gotchas. Each of these cost real time to discover.
# ---------------------------------------------------------------------------
gotchas:
  - id: agent-interruptions
    note: >
      Subagents die mid-task on spend limits, connection drops and stalls.
      Their on-disk edits PERSIST. Resume them with SendMessage using the
      agent id rather than starting a fresh agent — the transcript carries the
      context. Always tell a resumed agent to check current file state before
      redoing work, or it duplicates edits.
  - id: browser-session-sharing
    note: >
      Every tab on localhost:5173 shares one IndexedDB origin. Concurrent
      agents each opening a tab will fight over the same save, and clicking
      "Reset save" destroys another agent's test state. Use tabs_create for an
      isolated tab, close it when done, and check whether anyone else is
      mid-verification before resetting the save.
  - id: stale-hmr
    note: >
      Babylon does not reliably recover a scene after an HMR module error, and
      read_console_messages returns session-cumulative history. Both have
      produced confident-but-wrong conclusions. Judge a rendering change only
      after preview_stop + preview_start AND a fresh tab.
  - id: coupled-balance-values
    note: >
      Several data values are load-bearing against each other and have silently
      broken the game when changed alone. Habitat capacity vs the Garden Slide
      unlock threshold (the Slide was once literally unreachable). Dewdrop
      income vs upgrade cost curves. Tests derive these from the data tables;
      keep it that way — a hardcoded literal once degraded an assertion into
      "expected 0 to be greater than 0" instead of reporting the regression.
  - id: sim-boundary
    note: >
      Nothing under src/sim may import src/render, src/ui, src/audio or
      src/input. A test enforces it. Player intent that has no GameEvent member
      is exposed as plain functions on SimRuntime (purchaseUpgrade,
      setColourGateLane, getUpgradeLockReason).
  - id: sprite-positioning
    note: >
      Meshes are positioned by CENTRE. Heights chosen as if they were the
      bottom edge buried sprites inside drums repeatedly, in three separate
      places. src/render/propDims.ts is now the single source of truth for prop
      dimensions; derive heights from it rather than writing literals.

