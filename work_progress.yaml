# Work progress log for Tiny Terrarium Works.
#
# PURPOSE: this session has repeatedly been interrupted mid-task by API spend
# limits, connection drops and agent stalls. This file is the handoff record so
# work can resume without re-deriving context — for a future session, a
# different agent, or a subagent picking up someone else's half-finished change.
#
# MAINTENANCE CONTRACT — read this if you are an agent working in this repo:
#   * Update this file as part of the work, not afterwards as a chore.
#   * Record what you are ABOUT to do before a long task, so an interruption
#     leaves a trail rather than a mystery.
#   * Record findings that cost effort to discover, especially negative ones
#     ("X is not the cause") — those are the expensive ones to rediscover.
#   * Never record a task as done unless its checks actually passed. A
#     truthful "blocked" entry is worth more than an optimistic "done".

