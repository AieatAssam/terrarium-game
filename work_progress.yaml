      loop smoothly / not evenly distributed / visible jerk" and "conveyor
      belts remain flat on the ground, look painted on rather than placed on
      the terrain". NOTE this is the PATH network (src/render/world.ts +
      createPathFlowMaterial in pbrMaterials.ts), NOT the automation
      structures — the credits call these "path-conveyor chevrons" and the two
      systems are unrelated; do not confuse them again.
        JERK ROOT CAUSE (one line, and the "uneven spacing" was a red herring):
        advance() wrapped uOffset on 1/CHEVRONS_PER_TILE (0.5). Babylon
        composes UVs as `u = u0 * uScale + uOffset`, so uOffset is measured in
        WHOLE TEXTURE PERIODS no matter what uScale is — one chevron is 1.0 of
        uOffset. Wrapping at 0.5 snapped the whole march back by half a
        chevron every cycle. The spacing was always uniform (each half-tile
        flow quad shows exactly CHEVRONS_PER_TILE whole periods, so it is even
        across tiles AND around corners); what looked like uneven distribution
        was that half-step jump twice a second. Fixed by wrapping on 1.
        Side effect worth knowing: the march is now genuinely
        PATH_FLOW_SPEED chevrons/sec, i.e. 2x the old rate — the old constant's
        own doc comment had always CLAIMED that rate and the code delivered
        half of it.
        VERTICALITY: the whole network was CreateGround quads at y=0.01 — zero
        thickness, no lit side faces, no contact shadow, so "painted on" was
        literally accurate. Added a raised stone bed (PATH_BED_HEIGHT 0.075)
        built from the SAME half-tile `flowSegments` the flow overlay uses, so
        it follows the tread band and bends round corners instead of stamping
        a square plinth per tile. Measured live: 44 bed meshes, min height
        0.075, top face y 0.073. Tread quad moved from y=0.01 to PATH_TOP_Y;
        bed top is nudged 0.002 BELOW it so the two can never z-fight.
        FOLLOW-UP BUG in that same bed work, reported by the player and real:
        "outer corner of 90 degree bend misses curb". Each half-tile bed spans
        from the tile CENTRE outward along its own arm, so on a bend the
        quadrant behind BOTH arms — the outer corner of the turn — was covered
        by neither, while the tread art DOES run through it (the band's two
        outer edges meet there). Fix: one `across x across` hub box at each
        tile centre, which closes corners, junctions and straights at once and
        cannot protrude because `across` is exactly the width the arms already
        occupy. Skipped when flowSegments.length < 2 (a single-arm terminus,
        where half the hub would stick out past the tread's end into soil).
        Bed meshes 44 -> 65. If you add a new path piece type, remember the
        hub is keyed off segment COUNT, not piece type.
        NOT VERIFIED: that the jerk is gone IN MOTION. A wrap discontinuity is
        a motion artifact and Playwright screenshots are not timed finely
        enough to catch it frame-to-frame; the fix rests on the uOffset
        semantics plus a captured march sequence
        (tests/e2e/pathFlow.dev.spec.ts writes docs/qa-screenshots/path/).
