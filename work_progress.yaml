      instance — new placeAutomation(state, automationId, tile) is the
      actual build action, moved the default Colour Gate lanes / Mood Bell
      rule into it (only make sense once a structure exists). Fixed a REAL
      bug found via this decoupling: moodBellBehavioralState checked
      `unlockedAutomations.includes(...)` for gardenSlideBuilt/
      colourGateBuilt — harmless before (unlock+build were atomic), wrong
      now (an unlocked-but-unplaced Slide would have wrongly satisfied the
