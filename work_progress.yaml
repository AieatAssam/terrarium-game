      via synthetic PointerEvents inside one page.evaluate to beat the tick
      dispatcher). See the in_flight entry for the details.
  - id: ground-dropped-sprouts
    severity: low
    note: >
      CORRECTED 2026-07-31 — this entry's premise was WRONG for the common
      case, per its own project's "verify in the browser" standard: this
      session drove a REAL mouse drag (docs/_scratch/ground-drop-real-drag-
      probe.mjs — actual page.mouse down/move/up, not a bus-level fake) of
      a Nursery-idle Sprout onto open grass and it snapped straight back to
      its Nursery waiting slot, same tick, no code change needed. Root
      cause of the false premise: adjudicatePlacement's no-op (sim, quoted
      below) IS real, but src/render/sprouts.ts's own `sprout:dropped`
      handler already treats "no habitat, no automation" as "back to
      idle-at-Nursery" via claimNurserySlot, entirely independent of the
      sim no-op — nobody had checked the render side before writing this
      entry. adjudicatePlacement returns `{ state, events: [] }` when
      overHabitat is null (src/sim/systems.ts) — harmless, since an idle
      Sprout's sim `tile` is never mutated by pickup or a null-habitat drop
      either, so sim and render stay in agreement with no event needed.
      ONE real, narrower gap FOUND BUT DELIBERATELY NOT FIXED this session:
      a Sprout idle at the Colour Gate's signpost (tile = COLOUR_GATE_TILE,
      after a first-leg arrival — see bug #2 mechanism (b) above) would
      stay wherever a ground-drop released it, because claimNurserySlot
      only recognises the Nursery's own tile — nothing else repositions it.
      A first attempt at a fix (snap to `tileToWorld(visual.tile)` in the
      same handler) was written, then REVERTED per advisor review: it could
      not be runtime-verified (no scripted way to reach a Gate-parked idle
      Sprout this session) and had at least one concrete flaw found by
      inspection alone — it preserved `mesh.position.y` from the drag
      (SPROUT_FLOAT_HEIGHT, 1.13) rather than restoring SPROUT_RIDE_HEIGHT
      (~0.88, what a Gate arrival actually uses), and used the tile
      *centre* rather than wherever the ride visually parked it. Shipping
      an unverified fix with a known height mismatch for a case nobody
      could reproduce was judged worse than leaving the gap open and
      documented. STILL OPEN: this one edge case, low severity (per the
      instance-cap reasoning in bug #2 mechanism (b), at most ~1 Sprout can
      ever be in this state at once). A real fix needs either a scripted
      path to a Gate-parked idle Sprout (build the Colour Gate + fill a
      lane's habitat via the actual UI/upgrade flow) to verify against, or
      at minimum reusing SPROUT_RIDE_HEIGHT instead of the drag height.
      Original text, for the record: "GameRules section 5.3 already
      prescribes the fix: it should return to a waiting area. User floated
      'wilt and disappear' instead — declined, because that breaks sections
      7.4, 3.2, 14 and 2.5." That decision stands; it just turned out to
      already be the shipped behaviour for the common case.
  - id: habitat-full-art-unused
    severity: low
    note: >
      habitat.<id>.full exists in the asset manifest and is never used, though
      it is the strongest "visibly has no room" cue. Needs a crop-aware texture
      swap first, because attachStandee applies a UV content-crop per manifest
      key and a naive swap would render the art uncropped.
  - id: e2e-not-rerun
    severity: medium
    note: >
      PARTIALLY ACTIONED 2026-07-31. Ran load.dev/reducedMotion.dev/
      placement.dev against the NURSERY_FRONT_DISTANCE change (advisor
      flagged the regression risk directly: nurseryPickupScreenPoint
      projected the raw Nursery TILE CENTRE, not a real waiting-slot
      position). CONFIRMED REGRESSION, FIXED: 4 of 5 tests failed
      immediately (sprout:pickedUp never fired — the tile-centre click no
      longer landed within SPROUT_PICK_RADIUS of any real waiting Sprout
      once the front distance grew). Fixed tests/e2e/helpers.ts's
      nurseryPickupScreenPoint to read the nearest waiting Sprout's LIVE
      mesh position instead (same technique manualDrop.dev.spec.ts's own
      sproutScreenPoint already used) — committed. Hit a SECOND, subtler
      bug while fixing the first: a freshly spawned Sprout's mesh sits at
      the raw tile centre for its first ~420ms (reveal pop-in), then
      claimNurserySlot JUMPS it to its real waiting-slot offset in one
      frame (src/render/sprouts.ts's spawn()) — reading position once and
      clicking moments later can straddle that jump (measured: tile-centre-
      exact to 1.56 world units away, well outside the 0.55 pick radius).
      Fixed by polling until two position reads 80ms apart agree before
      clicking, rather than hardcoding the 420ms reveal duration in the
      test helper. 4 of 5 originally-failing tests now pass.

      ONE test still fails, root-caused as UNRELATED to this session's
      changes, NOT fixed: placement.dev.spec.ts's "settles it and earns
      Dewdrops" waits `dewdropTotal > 0` with a 5s timeout, but
      dewdropSystem's own math (src/sim/systems.ts) needs ~12.5s for one
      settled base-rate Sprout to cross a whole Dewdrop (0.008/tick x 10
      ticks/sec = 0.08/sec, 1/0.08 = 12.5s) — the test's own 5s timeout is
      arithmetically impossible to meet even with a perfect pick, and the
      drag/settle/journal-discovery part of the SAME test (checked first,
      passes) proves this session's pick fix works correctly. CONFIRMED,
      not just inferred: docs/GAME_DESIGN.md's own "Progression math"
      section still says `baseDewdropRate = 0.02` — and 0.02 gives EXACTLY
      5.0s to one whole Dewdrop (0.2/sec, 1/0.2=5), matching this test's
      timeout precisely. The code's real value is 0.008 (checked
      src/data/habitats.ts directly). Dates to bf4c1cd's Dewdrop rebalance
      ("whole upgrade tree went from ~9 minutes of income to ~33")
      outliving both this test's timeout AND that doc section, which is now
      flagged inline (STALE note added 2026-07-31) rather than silently
      rewritten, since downstream Dewdrops/min figures in that doc cascade
      from it and several balance values are load-bearing against each
      other (coupled-balance-values gotcha) — a partial fix risked being
      worse than an honestly-flagged stale one. Fix for the TEST itself is
      either raise the timeout past ~13s or grant a rate-boosting upgrade
      first; not done this session, flagged rather than fixed to keep this
      pass scoped to the regression it was checking for.

      PARTIALLY DONE: automation.dev.spec.ts WAS run this session (needed to
      verify the Sunflower Meadow automation change), surfacing 2 more
      pre-existing failures, NEITHER caused by that change — confirmed, not
      assumed:
        - "Colour Gate: behavioral purchase gate... does NOT charge
          Dewdrops or build it" fails deterministically, every run, on a
          FRESH page before any Garden Slide exists — provably unrelated to
          habitat targeting. Root cause: buyUpgradeViaUI's button lookup
          regex is `^Buy Colour Gate for`, but src/ui/components/
          upgrades.ts's render() (line ~124-131) sets the aria-label to
          `"${displayName}, not available yet. ${lockReason}"` whenever
          ANY lockReason is set — which it always is here (Colour Gate's
          first lock reason, "Your Garden Slide needs to be carrying
          Sprouts first," fires before a Slide exists, regardless of what
          it will target) — so the regex can never match and the click
          times out. A test/helper bug, not a sim bug.
        - "Garden Slide: visibly carries Sprouts... at the upgraded speed"
          failed twice, two DIFFERENT ways (first run: "an idle Slide runs
          no belt" assertion violated; retry: buildGardenSlide's own
          20s poll for `unlockedAutomations` timed out before even
          reaching that assertion) — inconsistent failure mode across runs
          is itself evidence of flakiness, not a deterministic regression.
          Matches this file's OWN already-documented spawnandid-pop-race
          gotcha (spawnAndDrop can silently drop the wrong natural-spawn
          Sprout when a pod spawn lands between a debug-spawn click and
          the id pop). BUT: the sunflowerMeadow-targeting change is NOT
          an innocent bystander here — under the old "most-fed" heuristic
          the Slide targeted emberNook and a stray natural Sun Sprout
          couldn't be boarded by it; now the Slide targets sunflowerMeadow,
          so a stray natural Sun Sprout landing during buildGardenSlide's
          setup CAN be picked up and shows up as belt movement, tripping
          "an idle Slide runs no belt". That's a real, if narrow,
          probability shift this change introduced on top of the
          pre-existing pop-race — not purely someone else's flake.
          buildGardenSlide's setup comment (tests/e2e/automation.dev.spec.ts)
          has been corrected to say so instead of the stale "emberNook fed
          the most" framing. Not fixed further (the underlying pop-race
          fix is out of scope here); still pre-existing in the sense that
          the race itself predates this session, but this session's change
          widened its blast radius for this one spec.
      Neither blocks the Sunflower Meadow work, which was verified through
      unit tests (deterministic) and a live browser session (real UI
      purchase, real repeated rides, real settle) instead. colourGate
      specs, starSprout.dev.spec.ts, and the preview project remain
      UNRUN this session. docs/QA_REPORT.md remains stale.
  - id: motion-config-contrast
    severity: low
    note: >
      MotionConfig has no high-contrast field, so habitats.ts reads
      data-contrast directly via its own MutationObserver. Folding contrast into
      motion.ts would remove the duplicate observer.
  - id: garden-slide-site-not-on-its-own-route
    severity: low
    note: >
      NEW 2026-07-31, from automating Sunflower Meadow. GARDEN_SLIDE_TILE
      (8,7) is fixed and physically one tile NORTH of the Nursery, on the
      trunk toward the Colour Gate — but the Slide's ride now always goes
      SOUTH to Sunflower Meadow instead. Mechanically harmless:
      gardenRouteBetween (src/render/sprouts.ts) BFS-searches the path
      network between the ride's actual endpoints (Nursery, target habitat)
      and never references the Slide's own site tile as a waypoint, for any
      target it has ever had — confirmed by reading the function, not
      assumed. So nothing is broken and no relocation was needed to ship
      the automation. What's left is purely a visual-coherence question a
      relocation WOULD answer: a player watching a Sprout glide south to
      the Meadow while the Slide's own structure stands north of the
      Nursery might read that as mismatched, even though nothing is
      functionally wrong. Considered moving GARDEN_SLIDE_TILE onto the
      southern run (e.g. (8,9)) instead, but that touches
      tests/unit/sim.colourGate.test.ts's two `tileDistance(...) === 1`
      assertions, tests/unit/render.pathPieces.test.ts, and
      tests/e2e/manualDrop.dev.spec.ts's import of the tile for its own
      drag target — judged a wide enough change to defer rather than bundle
      into the automation change itself (advisor guidance: don't reopen a
      settled design mid-implementation). If this reads badly in an actual
      playtest, relocating the site is the fix; the GAME_DESIGN.md topology
      section already documents the current state and links here.

# ---------------------------------------------------------------------------
# Decisions taken, so they are not silently relitigated
# ---------------------------------------------------------------------------
decisions:
  - q: Pivot to high-poly 3D / AAA models?
    a: >
      No. User chose "richer 2.5D, same pipeline". Fidelity comes from
      materials, lighting, bevelled geometry and layering — not from a
      modelling scope change.
  - q: Should Sprouts left on the ground wilt and vanish?
    a: >
      Recommended against — violates four GameRules sections. The
      spec-mandated alternative is returning to a waiting area. Not yet
      actioned; user has not replied.
  - q: New upgrade for picking a colour out of the hatchery?
    a: >
      Proposal recommends building nothing now. The Colour Gate already covers
      routing at the game's current complexity stage; a priority-picking device
      ("Priority Petal") belongs later, once a fourth habitat makes two lanes
      insufficient. Full sketch in docs/HATCHERY_PICKING_PROPOSAL.md.
  - q: WebGPU image-based lighting?
    a: >
      Gated to WebGL only. Any non-uniform environment cube content
      black-screens this project's WebGPU backend, reproduced across several
      construction paths. GameRules section 12 requires WebGL baseline and
      treats WebGPU as opportunistic, so shipping without IBL on that backend
      is compliant.
  - q: Automate Sunflower Meadow or leave it hand-carry-only?
    a: >
      Automate it. User decided 2026-07-31. IMPLEMENTED 2026-07-31 — see the
      completed-work entry below. CORRECTION to this entry's original text:
      it called this a "deliberate GameRules revision" needing a §17 change
      record. That was wrong — checked GameRules.md directly before
      implementing and it never mandates Sunflower Meadow being manual-only
      (it's just listed as an ordinary habitat, lines 276/309); the
      manual-only framing lived entirely in src/sim/layout.ts's own topology
      comment, i.e. this was an architecture decision recorded in a code
      comment, not a GameRules constraint, so §17 (which governs changing
      GameRules itself) never applied. Docs WERE still updated deliberately
      (ARCHITECTURE.md, GAME_DESIGN.md, the topology comment itself,
      dependent tests) — same rigor, lighter process.
  - q: What happens to a Sprout dropped on open grass?
    a: >
      It returns to the Nursery waiting area, per GameRules 5.3 as written.
      User confirmed 2026-07-31. TURNED OUT ALREADY IMPLEMENTED for the
      common case (verified 2026-07-31 with a real pointer drag, see the
      corrected ground-dropped-sprouts open_issue) — adjudicatePlacement's
      sim-side no-op was real but harmless; src/render/sprouts.ts's
      sprout:dropped handler already snaps a Nursery-idle Sprout back to
      its waiting slot. NO CODE CHANGED for this one: a narrow edge case
      (Colour-Gate-parked idle Sprout) is still open — an attempted fix was
      written and then reverted, unverified and with a known flaw; see the
      ground-dropped-sprouts open_issue for what's left to do there.
  - q: Keep the 2026-07-31 Sunflower Meadow automation, given
      docs/HATCHERY_PICKING_PROPOSAL.md argued explicitly to keep it
      hand-carried forever (see the now-closed
      meadow-automation-contradicts-prior-proposal open_issue)?
    a: >
      RESOLVED 2026-08-01 — user chose option (a): keep the automation as
      shipped. All 3 common Sprout types are now fully automatable once
      both Garden Slide and Colour Gate are built; only Star Sprouts (6.3%
      of spawns) still require a manual drag at that point. Consequence
      accepted, not revisited. docs/HATCHERY_PICKING_PROPOSAL.md's
      "keep Meadow hand-carried as a feature" recommendation is SUPERSEDED
      by this decision — the doc itself should get a status note pointing
      here rather than being deleted (it's still useful context for why the
      question existed). "Next phase" work should build on the
      full-automation baseline: the interesting manual interaction going
      forward is Star Sprouts and whatever GameRules §9.6 stage 4+ /
      §9.5 introduces, not re-litigating which habitat stays manual.
  - q: Stay inside Phase 1's declared scope, or lift docs/GAME_DESIGN.md's
      "no additional Sprout types, habitats, or automations" non-goal to
      start Phase 2?
    a: >
      RESOLVED 2026-08-01 — user chose to LIFT it. docs/GAME_DESIGN.md's
      "Out of scope for Phase 1" section updated (struck through, not
      deleted, with the reasoning recorded inline): this was always a
      Phase-1-scoped implementation-tracking non-goal in that document, not
      a GameRules constraint, so this is NOT a GameRules §17 revision —
      GameRules.md itself never forbade a Phase 2 (§9.5 names concrete
      future automation families, §9.6's complexity curve has 9 stages vs
      Phase 1's 3, §16's own required closing feeling explicitly wants
      "...but I cannot wait to see what I can unlock and improve next").
      Grepped tests/unit/ for anything pinning "no additional automations"
      as a boundary — nothing does, so no test needed updating for the lift
      itself. NOT YET DONE: docs/CONTRACTS.md's AutomationId/SproutTypeId
      unions are untouched (still exactly gardenSlide|colourGate and
      ember|dew|sun|star) — those get extended deliberately once a SPECIFIC
      Phase 2 feature is chosen, not as part of this scope-lift alone. What
      that feature actually is — a new Sprout trait/type (§7.3, §9.6 stage
      4 "multi-attribute routes"), a new automation family (§9.5: Routing/
      Care/Growth/Organisation helpers), or something else — has not been
      decided yet.

  - q: >
      2026-08-01 — user asked to "recheck sprout interactivity and mobile
      friendliness... easy to snap sprouts to slides and other
      interactables, same for habitats." What changed?
    a: >
      ONE confirmed, contained CSS bug fixed and verified live: at
      <=480px viewport width, .tt-nav (bottom nav) and .tt-buildmenu
      (build menu / Garden Slide button) both anchored to bottom:14px and
      geometrically overlapped (measured via getBoundingClientRect at
      375px: nav right edge 323.5px, buildmenu left edge 223.7px, same
      vertical band) — a real functional collision blocking taps on
      either. Fixed in src/ui/styles.ts's existing 480px media query by
      stacking .tt-buildmenu above .tt-nav (bottom: 86px) instead of
      beside it; re-verified at 375px post-fix, rects no longer overlap
      (buildmenu bottom 726px, nav top 734px, 8px clear gap), full
      typecheck/lint/292-tests/build all green. NOT changed:
      SPROUT_PICK_RADIUS / HOVER_MARGIN_TILES — see
      mobile-pick-forgiveness-measured above for the measured numbers and
      why a naive increase would make crowded-nursery-pick-radius worse.
      Also NOT changed: the missed-pick-falls-through-to-pan behavior
      (see gotcha above) — both are reported to the user as open design
      questions rather than resolved unilaterally, since both need either
      a GameRules-aware trade-off call or a camera-behavior change bigger
      than this recheck's scope.

