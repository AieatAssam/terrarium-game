open_issues:
  - id: manual-drag-onto-slide-not-pointer-tested
    severity: low
    note: >
      adjudicateAutomationDrop + the sprout:dropped.overAutomation wiring is
      unit-tested (10 cases, exact) and browser-verified at the bus level
      (a real decline round-tripped through input->bus->sim->event with the
      Sprout confirmed still enabled/pickable). NOT independently verified
      via an actual mouse drag (computer tool pointer events) onto the
      Slide specifically, because the shared Browser-pane session's save
      had grown too large/messy for reliable coordinate math in the time
      available. If picking this up: reset the save first, build ONE
      Garden Slide, and drag an eligible Sprout onto it — see the
      playwright-vs-browser-pane gotcha for a cleaner alternative (seed a
      seeded, small save via a headed Playwright script rather than the
      live shared tab).
  - id: ground-dropped-sprouts
    severity: medium
    note: >
      adjudicatePlacement returns a no-op when overHabitat is null
      (src/sim/systems.ts), so a Sprout dropped on open grass stays there
      permanently. GameRules section 5.3 already prescribes the fix: it should
      return to a waiting area. User floated "wilt and disappear" instead —
      declined, because that breaks sections 7.4, 3.2, 14 and 2.5 (despawn from
      inaction, distress state, creature death, loss). Awaiting a decision.
  - id: habitat-full-art-unused
    severity: low
    note: >
      habitat.<id>.full exists in the asset manifest and is never used, though
      it is the strongest "visibly has no room" cue. Needs a crop-aware texture
      swap first, because attachStandee applies a UV content-crop per manifest
      key and a naive swap would render the art uncropped.
  - id: e2e-not-rerun
    severity: medium
    note: >
      The Playwright suite has not been run end to end against the recent
      rendering, economy and topology changes. It is deliberately excluded from
      CI (needs browser binaries, slow). docs/QA_REPORT.md is correspondingly
      behind.
  - id: motion-config-contrast
    severity: low
    note: >
      MotionConfig has no high-contrast field, so habitats.ts reads
      data-contrast directly via its own MutationObserver. Folding contrast into
      motion.ts would remove the duplicate observer.

# ---------------------------------------------------------------------------
# Decisions taken, so they are not silently relitigated
# ---------------------------------------------------------------------------
decisions:
  - q: Pivot to high-poly 3D / AAA models?
    a: >
      No. User chose "richer 2.5D, same pipeline". Fidelity comes from
      materials, lighting, bevelled geometry and layering — not from a
      modelling scope change.
  - q: Should Sprouts left on the ground wilt and vanish?
    a: >
      Recommended against — violates four GameRules sections. The
      spec-mandated alternative is returning to a waiting area. Not yet
      actioned; user has not replied.
  - q: New upgrade for picking a colour out of the hatchery?
    a: >
      Proposal recommends building nothing now. The Colour Gate already covers
      routing at the game's current complexity stage; a priority-picking device
      ("Priority Petal") belongs later, once a fourth habitat makes two lanes
      insufficient. Full sketch in docs/HATCHERY_PICKING_PROPOSAL.md.
  - q: WebGPU image-based lighting?
    a: >
      Gated to WebGL only. Any non-uniform environment cube content
      black-screens this project's WebGPU backend, reproduced across several
      construction paths. GameRules section 12 requires WebGL baseline and
      treats WebGPU as opportunistic, so shipping without IBL on that backend
      is compliant.

open_questions:
  - Should ground-dropped Sprouts walk back to the Nursery waiting area (GameRules 5.3)?
  - Re-run the Playwright e2e suite and refresh docs/QA_REPORT.md?
