# ---------------------------------------------------------------------------
# Authority: what wins when documents disagree
# ---------------------------------------------------------------------------
canonical_docs:
  - path: docs/_scratch/GameRules.md
    role: >
      THE canonical design spec. Its section 17 states it wins over any
      implementation, and that revising it requires a deliberate, recorded
      change plus updates to dependent docs and tests. Do not quietly
      contradict it to make an implementation easier. If a feature request
      conflicts with it, say so and ask, rather than implementing either side
      silently.
  - path: docs/CONTRACTS.md
    role: Integration contract — event union, ids, grid model, save format.
  - path: docs/ARCHITECTURE.md
    role: As-built architecture. Kept in sync deliberately; it has gone stale before.
  - path: docs/HATCHERY_PICKING_PROPOSAL.md
    role: Design investigation, not yet implemented. See open_questions below.

# ---------------------------------------------------------------------------
# Hard-won gotchas. Each of these cost real time to discover.
# ---------------------------------------------------------------------------
gotchas:
  - id: agent-interruptions
    note: >
      Subagents die mid-task on spend limits, connection drops and stalls.
      Their on-disk edits PERSIST. Resume them with SendMessage using the
      agent id rather than starting a fresh agent — the transcript carries the
      context. Always tell a resumed agent to check current file state before
      redoing work, or it duplicates edits.
  - id: browser-session-sharing
    note: >
      Every tab on localhost:5173 shares one IndexedDB origin. Concurrent
      agents each opening a tab will fight over the same save, and clicking
      "Reset save" destroys another agent's test state. Use tabs_create for an
      isolated tab, close it when done, and check whether anyone else is
      mid-verification before resetting the save.
  - id: stale-hmr
    note: >
      Babylon does not reliably recover a scene after an HMR module error, and
      read_console_messages returns session-cumulative history. Both have
      produced confident-but-wrong conclusions. Judge a rendering change only
      after preview_stop + preview_start AND a fresh tab.
  - id: coupled-balance-values
    note: >
      Several data values are load-bearing against each other and have silently
      broken the game when changed alone. Habitat capacity vs the Garden Slide
      unlock threshold (the Slide was once literally unreachable). Dewdrop
      income vs upgrade cost curves. Tests derive these from the data tables;
      keep it that way — a hardcoded literal once degraded an assertion into
      "expected 0 to be greater than 0" instead of reporting the regression.
  - id: sim-boundary
    note: >
      Nothing under src/sim may import src/render, src/ui, src/audio or
      src/input. A test enforces it. Player intent that has no GameEvent member
      is exposed as plain functions on SimRuntime (purchaseUpgrade,
      setColourGateLane, getUpgradeLockReason).
  - id: sprite-positioning
    note: >
      Meshes are positioned by CENTRE. Heights chosen as if they were the
      bottom edge buried sprites inside drums repeatedly, in three separate
      places. src/render/propDims.ts is now the single source of truth for prop
      dimensions; derive heights from it rather than writing literals.
  - id: sunflower-meadow-manual-only
    note: >
      Sunflower Meadow has NO automated route in Phase 1 by design (src/sim/
      layout.ts: only the trunk-and-fork feeds Ember Nook/Dew Pond; the
      southern run to the Meadow is the deliberate hand-carried fallback).
      Roughly a third of any large accumulated Sprout population (Sun type)
      will therefore NEVER move on its own no matter what — this reads like a
      transport bug in a big/old save and is not one. Confirmed by reading
      src/sim/layout.ts's own topology comment, not rediscovered by trial.
  - id: debug-hook-promise-timing
    note: >
      The dev debug panel's buttons (spawn/grant/speed/reset) all go through
      `simRuntimePromise.then(...)` in src/main.ts, i.e. genuinely async even
      though the promise is long since resolved — a synchronous read of
      window.__terrariumUIF.store.getState() on the very next line after
      .click() will see the PRE-click value and look like the button is
      broken. Cost real time to diagnose (looked exactly like a wiring
      regression). Always `await` a real delay (setTimeout, not just a
      microtask) before reading state back in a debug-panel test.
  - id: backgrounded-tab-throttling
    note: >
      A Browser-pane tab that is not the fronted one reports
      document.hidden=true and throttles rAF/timers unpredictably —
      javascript_exec calls have hung/timed out against a backgrounded tab.
      Call tabs_select on your tab before any test that depends on the sim
      loop or render loop actually ticking, not just before screenshots.
  - id: playwright-vs-browser-pane
    note: >
      For anything timing/FPS-sensitive, prefer a standalone headed
      Playwright script (chromium.launch({headless:false}), CDP
      Emulation.setCPUThrottlingRate to simulate a weaker laptop) over the
      Browser pane: it is a real OS-visible window with a real rAF, is
      immune to the shared-tab/backgrounded-tab issues above, and a seeded
      IndexedDB save (write directly, then reload — NOT via beforeunload,
      which overwrites it with live empty state) gives a reproducible
      starting population. Confirmed the reported crowd-FPS regression this
      way: 13.6 FPS median at 8x CPU throttle on the pre-fix code, in the
      exact scenario that was 60 FPS unthrottled — the bug only shows under
      representative hardware constraints.
  - id: drag-height-plane-vs-ground-plane
    note: >
      A HELD Sprout's mesh sits on the pointer's DRAG_HEIGHT plane
      (y = SPROUT_FLOAT_HEIGHT = 1.13), but endDrag resolves the drop on the
      GROUND plane (y = 0). At the default camera (elevation ~28 deg) the
      two projections of the SAME pixel are ~2.1 world units apart, the
      drag-height one closer to the camera. Verified numerically from
      src/input/index.ts's own console.debug ray logs: pixel (687,360) ->
      ground (8.00, 7.00) exactly, drag-height (6.43, 5.56). So: projecting
      a tile at y=0 gives the correct DROP pixel, but the mesh will not be
      standing on that tile while held, and a declined/left Sprout remains
      at the drag-height position, not at the drop tile. Any test or code
      comparing a held/just-dropped mesh position against tile coordinates
      must account for this — it cost three diagnostic e2e runs.
  - id: crowded-nursery-pick-radius
    note: >
      Nursery waiting slots fan out 0.5 world units apart
      (NURSERY_SLOT_LATERAL) but pickSproutId accepts anything within 0.55
      of the pointer's ground point (SPROUT_PICK_RADIUS) — picking a
      SPECIFIC Sprout out of a crowded waiting area is genuinely ambiguous,
      for players and tests alike. e2e drags should pick by live mesh
      projection and be prepared to have grabbed a neighbour.
  - id: spawnandid-pop-race
    note: >
      tests/e2e/helpers.ts's debugSpawnAndGetId pops the LAST id pushed to
      __ttSpawnedIds — but natural pod spawns push to the same array, so any
      pod spawn landing between the debug click and the pop makes
      spawnAndDrop drop the wrong (natural) Sprout. In build-heavy specs
      this silently leaves correctPlacementCount short of the Garden Slide
      unlock and fails 20-60s later at the unlock poll, looking like a
      progression bug. manualDrop.dev.spec.ts works around it with
      debugSpawnViaDom (filters ids by the debug-sprout- prefix);
      automation.dev.spec.ts and starSprout.dev.spec.ts still use the racy
      helper and can flake the same way.

