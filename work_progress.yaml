      4->5; save.ts's v4->v5 migration backfills siteTile from the OLD
      fixed AUTOMATION_SITE_TILES[automationId] default (the true
      historical value — a v4 save's automations were always built there,
      no other tile was possible). `automation:built`'s event payload and
      `save:loaded`'s snapshot both gained the site-tile fields the
      renderer will need in Phase 1.4. New tests/unit/sim.layout.test.ts
