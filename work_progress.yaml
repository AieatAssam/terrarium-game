  - q: >
      2026-08-01 — plan.yaml Phase 1 ("manual placement of the 3 existing
      automations") in progress. Status as of this entry?
    a: >
      Phase 1.1 (audit), 1.2 (sim decoupling), 1.3 (site validity + v4->v5
