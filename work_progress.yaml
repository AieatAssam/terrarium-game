      the LAST spawn id, and the Nursery pod keeps spawning throughout — a
      natural dew/sun Sprout landing in the same moment silently hands back
      the wrong id, the drop is adjudicated as a MISmatch, and the spec fails
      for a reason unrelated to what it tests (observed as peakHabitatScale
      1.002, the incorrect-placement wobble, instead of 1.119). Select the id
      from recorded bus traffic filtered by sproutType instead.
