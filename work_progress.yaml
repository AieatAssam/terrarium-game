      UNCOMMITTED as of this entry — do not assume these files are settled
      if picking this up cold; check `git status` first.
      What landed: GARDEN_PATH_TILES + pathBetween MOVED from
      src/render/layout.ts to src/sim/layout.ts (sim needs the path
      network to compute a placed automation's destination, and sim must
      never import from render) — render/layout.ts now re-exports it, same
      pattern as every other tile position. New pure sim functions:
      findPathRoute (the BFS, extracted from src/render/sprouts.ts's
      gardenRouteBetween, which now calls this instead of keeping its own
      copy), nearestReachableHabitat (a site tile's destination = nearest
