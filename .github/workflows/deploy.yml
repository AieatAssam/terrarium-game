# Builds the game and publishes it to GitHub Pages.
# Pages serves the project from https://<user>.github.io/<repo>/, so the build
# is given that subpath via VITE_BASE (see vite.config.ts) — derived from the
# repository name so a fork or a rename needs no edit here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it, so Pages is not left serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Gate the deploy on the same checks used locally, so a broken build
      # cannot reach Pages. Unit tests are headless (jsdom, no Babylon/canvas)
      # and need no extra services; the Playwright e2e suite is deliberately
      # not run here, as it needs browser binaries and is far slower.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # SPA-ish safety net: Pages serves 404.html for unknown paths, and
      # copying index.html there keeps a deep link or refresh from showing
      # GitHub's own 404 page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
